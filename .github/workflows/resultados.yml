name: Apuração do 2º turno

on:
  workflow_dispatch:
    inputs:
      eleicao:
        description: "Código da eleição no TSE (deixe vazio para descobrir sozinho)"
        required: false
  schedule:
    # 25/10 das 17h às 23h50 de Brasília (UTC-3), de 10 em 10 minutos
    - cron: "*/10 20-23 25 10 *"
    - cron: "*/10 0-2 26 10 *"

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/buscar_resultados.py ${{ inputs.eleicao }}
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add segundo-turno.json
          git diff --cached --quiet && exit 0
          git commit -m "Apuração do 2º turno"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
