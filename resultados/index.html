* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--papel) var(--aq-papel) fixed; color: var(--tinta); font: 400 15px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--azul); }
:root[data-theme="dark"] a { color: var(--tinta); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a { color: var(--tinta); } }
.bandeirola { height: 16px; margin-top: 4px; background: var(--aq-faixa) center / 100% 100% no-repeat; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: var(--space-4); padding-block: 28px 64px; display: flex; flex-direction: column; gap: var(--space-6); }
header { display: flex; flex-direction: column; gap: var(--space-3); }
.topo { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
h1 { font: 800 clamp(28px, 6vw, 40px)/1.05 var(--font-display); letter-spacing: -0.03em; margin: 0; font-variant-numeric: lining-nums; }
h1 em { font-style: normal; color: var(--verde-texto); }
h2 { font: 800 22px/1.2 var(--font-display); letter-spacing: -0.02em; margin: 0; }
h3 { font: 700 15px/1.3 var(--font-sans); margin: 0; }
.lede { margin: 0; color: var(--tinta-suave); max-width: 72ch; font-size: 14px; line-height: 22px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.rot { font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
nav.links { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; height: var(--control-h-sm); padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--linha-forte); background: var(--papel-elevado); color: var(--tinta); font: 500 13px/1 var(--font-sans); text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--azul); }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, select:focus-visible, .tab tr:focus-visible, svg path:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.trilha { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.trilha button { background: none; border: 0; padding: 0; font: inherit; color: var(--azul); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
:root[data-theme="dark"] .trilha button { color: var(--tinta); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .trilha button { color: var(--tinta); } }
.trilha b { font-weight: 700; }
.ctrl { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; position: sticky; top: 0; z-index: 3; background: var(--papel); padding-block: var(--space-2); border-bottom: 1px solid var(--linha); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--papel-fundo); border: 1px solid var(--linha); border-radius: var(--radius-md); max-width: 100%; overflow-x: auto; }
.seg button { flex: none; font: 500 13px/1 var(--font-sans); color: var(--tinta-suave); background: transparent; border: 0; border-radius: 6px; height: 28px; padding: 0 var(--space-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--azul); color: var(--on-azul); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
input.cx, select.cx { height: var(--control-h); border-radius: var(--radius-md); border: 1px solid var(--linha-forte); background: var(--papel-elevado); color: var(--tinta); padding: 4px var(--space-3); font: 400 14px/20px var(--font-sans); min-width: 0; }
input.cx { flex: 1 1 220px; }
.busca { position: relative; flex: 1 1 240px; display: flex; }
.sug { position: absolute; inset: calc(100% + 4px) 0 auto 0; background: var(--papel-elevado); border: 1px solid var(--linha-forte); border-radius: var(--radius-md); box-shadow: var(--sombra-md); list-style: none; margin: 0; padding: 4px; z-index: 5; max-height: 300px; overflow: auto; }
.sug li { padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.sug li:hover, .sug li[aria-selected="true"] { background: var(--azul-suave); color: #0f1a2e; }
