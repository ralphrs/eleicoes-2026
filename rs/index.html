body { background: var(--papel); color: var(--tinta); font: 400 15px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--azul); text-underline-offset: 3px; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: var(--space-4); padding-block: 28px 64px; display: flex; flex-direction: column; gap: var(--space-6); }
header { display: flex; flex-direction: column; gap: var(--space-3); }
.topo { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }

.marca .logo { width: 36px; height: 36px; flex: none; }
.marca .uf { width: 30px; height: 20px; flex: none; border-radius: 2px; overflow: hidden; display: block; }
h1 { font: 800 clamp(26px, 6vw, 34px)/1.05 var(--font-display); letter-spacing: -0.025em; margin: 0; font-variant-numeric: lining-nums; }

.status { font: 400 12px/16px var(--font-mono); color: var(--tinta-suave); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.status b { color: var(--tinta); font-weight: 500; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--verde); margin-right: 6px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: p 2.4s ease-in-out infinite; } @keyframes p { 50% { opacity: .35; } } }

.dd-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); white-space: nowrap; border-radius: var(--radius-md); font: 500 14px/20px var(--font-sans); height: var(--control-h); padding: 0 var(--space-4); border: 1px solid transparent; cursor: pointer; color: var(--tinta); background: transparent; text-decoration: none; }
.dd-btn:focus-visible, a:focus-visible, .seg button:focus-visible, .chip:focus-visible, summary:focus-visible, .dd-input:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.dd-btn--outline { background: var(--papel-elevado); border-color: var(--linha-forte); box-shadow: var(--sombra-sm); }
.dd-btn--outline:hover { background: var(--papel-fundo); }
.dd-btn--link { color: var(--azul); padding: 0; height: auto; }
.dd-btn--link:hover { text-decoration: underline; text-underline-offset: 4px; }
.dd-btn svg { width: 16px; height: 16px; flex: none; }
.dd-btn--primary { background: var(--azul); color: var(--on-azul); }
.dd-btn--primary:hover { box-shadow: var(--sombra-md); }
.dd-btn--primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.dd-badge { display: inline-flex; align-items: center; border-radius: var(--radius-sm); border: 1px solid currentColor; padding: 1px 8px; font: 600 11.5px/16px var(--font-sans); white-space: nowrap; color: var(--tinta-suave); }
.b-esq { color: var(--espectro-esquerda); }
.b-cen { color: var(--espectro-centro); }
.b-dir { color: var(--espectro-direita); }
.b-warn { color: var(--checagem-impreciso); background: var(--checagem-impreciso-suave); border-color: transparent; }
.b-novo { color: var(--azul); background: var(--azul-suave); border-color: transparent; }

.tools { display: flex; flex-direction: column; gap: var(--space-3); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--papel); padding-block: var(--space-3); z-index: 2; border-bottom: 1px solid var(--linha); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--papel-fundo); border: 1px solid var(--linha); border-radius: var(--radius-md); max-width: 100%; overflow-x: auto; scrollbar-width: none; align-self: flex-start; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; font: 500 13px/1 var(--font-sans); color: var(--tinta-suave); background: transparent; border: 0; border-radius: 6px; height: 30px; padding: 0 var(--space-3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--tinta); }
.seg button[aria-pressed="true"] { background: var(--azul); color: var(--on-azul); box-shadow: var(--sombra-sm); }
.seg button[aria-pressed="true"] .k { color: var(--on-azul); opacity: .8; }
#cargos button[aria-pressed="true"]::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--amarelo); }
.seg button .k { font: 500 11px var(--font-mono); color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.seg svg { width: 14px; height: 14px; }
.seg--sm button { height: 26px; padding: 0 10px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px/1 var(--font-sans); color: var(--tinta); background: transparent; border: 1px solid var(--linha); border-radius: var(--radius-pill); padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--papel-elevado); }
.chip .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--tinta-suave)); }
.chip .k { font: 400 11px var(--font-mono); color: var(--tinta-suave); }
.chip[aria-pressed="true"] { border-color: var(--azul); background: var(--azul); color: var(--on-azul); }
.chip[aria-pressed="true"] .k { color: var(--on-azul); opacity: .8; }
.chip[aria-pressed="true"] .dot { outline: 1.5px solid var(--on-azul); }
.filtros { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.dd-input { height: var(--control-h); flex: 1 1 220px; min-width: 0; border-radius: var(--radius-md); border: 1px solid var(--linha-forte); background: var(--papel-elevado); padding: 4px var(--space-3); font: 400 14px/20px var(--font-sans); color: var(--tinta); box-shadow: var(--sombra-sm); }
select.dd-input { flex: 0 1 200px; }
.dd-input::placeholder { color: var(--tinta-suave); }

h2 { font: 800 21px/1.25 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; font-variant-numeric: lining-nums; }
h2 small { font: 400 12px var(--font-mono); color: var(--tinta-suave); letter-spacing: 0; margin-left: 8px; }
.lede { margin: 0; color: var(--tinta-suave); font-size: 13.5px; line-height: 20px; max-width: 72ch; }
.bloco { display: flex; flex-direction: column; gap: var(--space-4); }

/* Cards de candidato */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-3); }
.cand { position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-xl); border: 1px solid var(--linha); background: var(--papel-elevado); box-shadow: var(--sombra-sm); color: var(--tinta); text-decoration: none; }
.cand:hover { border-color: var(--azul); box-shadow: var(--sombra-md); }
.foto { width: 72px; height: 96px; border-radius: var(--radius-md); object-fit: cover; background: var(--papel-fundo); display: block; }
.cand .corpo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cand .linha1 { display: flex; align-items: baseline; gap: 8px; }
.cand .rank { font: 500 12px var(--font-mono); color: var(--verde-texto); }
.cand .nome { font: 800 17px/1.2 var(--font-display); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.cand .sub { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.urna { display: inline-flex; gap: 2px; }
.urna i { font: 700 13px/1 var(--font-mono); font-style: normal; padding: 4px 5px; min-width: 1.6em; text-align: center; border: 1px solid var(--linha-forte); border-radius: var(--radius-sm); background: var(--papel-elevado); color: var(--tinta); }
.urna--g { gap: 3px; }
.urna--g i { font-size: 22px; padding: 8px 10px; border-radius: 6px; }
.barra { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: auto; }
.barra .trilha { height: 6px; border-radius: 3px; background: var(--papel-fundo); overflow: hidden; }
.barra .trilha span { display: block; height: 100%; background: var(--verde); border-radius: 3px; }
.barra b { font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cand a.nome { color: inherit; text-decoration: none; }
.cand a.nome::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-xl); }
.cmp-btn { position: relative; z-index: 1; align-self: flex-start; font: 500 12px/1 var(--font-sans); color: var(--tinta-suave); background: transparent; border: 1px solid var(--linha); border-radius: var(--radius-pill); padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.cmp-btn:hover { background: var(--papel-fundo); color: var(--tinta); }
.cmp-btn[aria-pressed="true"] { border-color: var(--azul); background: var(--azul-suave); color: var(--azul); }
.cmp-btn:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.cmp-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: 10px var(--space-3); border-radius: var(--radius-lg); border: 1px solid var(--azul); background: var(--azul-suave); font-size: 13.5px; }
.comp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-4); }
.comp .rot { grid-column: 1 / -1; font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--linha); padding-top: 10px; margin-top: 14px; }
.comp .cel { min-width: 0; font-size: 14px; overflow-wrap: anywhere; padding-top: 4px; }
.comp .cel .foto { width: min(132px, 100%); height: auto; aspect-ratio: 3 / 4; border-radius: var(--radius-lg); }
.comp .cel h3 { font: 800 clamp(18px, 4vw, 26px)/1.15 var(--font-display); margin: 8px 0 6px; }
.comp ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 8px; }
.comp li b { font-weight: 600; }
.props { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 var(--space-6); }
.props li { padding-block: 10px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 3px; }
.props .tema { font: 500 11px/16px var(--font-mono); color: var(--verde-texto); text-transform: uppercase; letter-spacing: .06em; }
.props p { margin: 0; font-size: 14.5px; }
/* Página do candidato */
.perfil { display: flex; flex-direction: column; gap: var(--space-6); }
.cab { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.cab .foto { width: 132px; height: 176px; border-radius: var(--radius-lg); }
.cab .info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cab h2 { font-size: clamp(26px, 5vw, 34px); line-height: 1.1; }
.cab .cargo { font: 500 12px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
.dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px var(--space-6); margin: 0; }
.dados div { min-width: 0; }
.dados dt { font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
.dados dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
@media (max-width: 520px) { .cab { grid-template-columns: 96px minmax(0, 1fr); } .cab .foto { width: 96px; height: 128px; } }
.prosa { margin: 0; max-width: 70ch; font-size: 16px; line-height: 26px; }
.nota { font-size: 13px; color: var(--tinta-suave); margin: 0; max-width: 72ch; }
.duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-6); }
.fatos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fatos li { padding-block: 12px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 4px; }
.fatos li:first-child { border-top: 0; padding-top: 0; }
.fatos p { margin: 0; font-size: 14.5px; line-height: 22px; }
.fonte { font: 400 12px/16px var(--font-mono); color: var(--tinta-suave); text-decoration: none; overflow-wrap: anywhere; }
a.fonte:hover { color: var(--azul); text-decoration: underline; }
.sinal { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; background: var(--c); }
.item { padding-block: 14px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.item a.titulo { font: 600 15.5px/1.35 var(--font-sans); color: var(--tinta); text-decoration: none; overflow-wrap: anywhere; }
.item a.titulo:hover { color: var(--azul); text-decoration: underline; text-underline-offset: 3px; }
.meta { font: 400 12px/16px var(--font-mono); color: var(--tinta-suave); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.resumo { margin: 0; max-width: 68ch; font-size: 14.5px; }
.vazio { background: var(--papel-elevado); border: 1px dashed var(--linha-forte); border-radius: var(--radius-xl); padding: var(--space-6); color: var(--tinta-suave); }
.vazio strong { color: var(--tinta); display: block; margin-bottom: 4px; font: 800 17px var(--font-display); }

.t2 { font-size: 12px; line-height: 1.35; color: var(--tinta-suave); }
.t2 b { font-weight: 500; color: var(--tinta); }
.faixa { display: flex; align-items: flex-start; gap: 6px; padding: var(--space-3) var(--space-3) calc(var(--space-3) + 6px); border-radius: var(--radius-xl); border: 1px solid var(--linha); background: var(--papel-elevado); box-shadow: var(--sombra-sm); position: relative; overflow: hidden; }
.faixa::after { content: ""; position: absolute; inset: auto -4px -3px -4px; height: 14px; background: var(--faixa-uf) center / 100% 100% no-repeat; }

.votos { font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--tinta); }
h3.grupo-t { font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; margin: var(--space-4) 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--linha); }

.deps li { display: grid; grid-template-columns: 26px auto minmax(0, 1fr); gap: 10px; align-items: center; padding-block: 9px; border-top: 1px solid var(--linha); }
.deps .n { font-weight: 500; font-size: 14.5px; overflow-wrap: anywhere; }
.deps .p { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.deps .r { font: 400 11px var(--font-mono); color: var(--verde-texto); text-align: right; }
/* Fontes */
.tabela { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--radius-lg); background: var(--papel-elevado); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--linha); vertical-align: top; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--papel-fundo) 45%, transparent); }
thead th { border-top: 0; font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
details { border-top: 1px solid var(--linha); padding-block: 10px; }
details:first-of-type { border-top: 0; }

details ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
footer { font-size: 12.5px; color: var(--tinta-suave); border-top: 1px solid var(--linha); padding-top: 14px; }
/* Aquarela: só nas camadas decorativas; controles e cards continuam limpos */
body { background: var(--papel) var(--aq-papel) fixed; }

.vazio { background: var(--papel-elevado) var(--aq-papel); }
.preview-aviso { font: 500 12px/16px var(--font-mono); background: var(--amarelo); color: var(--on-amarelo); text-align: center; padding: 6px var(--space-4); }

squerda","espBase":"Classificação usada pelo InfoMoney no perfil dos candidatos de 2026, em linha com o posicionamento do PT e da aliança com o PSB.","espFonte":"https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","pos_":[{"texto":"A taxa de desemprego ficou em 5,3% no trimestre encerrado em agosto de 2026, a menor para o período desde o início da série do IBGE, em 2012. A população ocupada chegou a 103,5 milhões, um recorde.","fonte":"https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/taxa-de-desemprego-cai-para-53-menor-para-o-trimestre-ate-agosto"},{"texto":"O Brasil saiu do Mapa da Fome da ONU em julho de 2025, segundo relatório da FAO divulgado durante o terceiro mandato.","fonte":"https://www.gov.br/mds/pt-br/noticias-e-conteudos/desenvolvimento-social/noticias-desenvolvimento-social/brasil-sai-do-mapa-da-fome-da-onu-conquista-historica-reflete-politicas-publicas-eficazes"},{"texto":"Sancionou em 26 de novembro de 2025 a lei que isenta do Imposto de Renda quem ganha até R$ 5 mil por mês, com desconto parcial até R$ 7.350. A estimativa é de cerca de 15 milhões de beneficiados, com compensação por tributação mínima de rendas acima de R$ 600 mil por ano.","fonte":"https://www12.senado.leg.br/radio/1/noticia/2025/11/26/isencao-do-imposto-de-renda-para-quem-ganha-ate-r-5-mil-e-sancionada"},{"texto":"Foi eleito presidente três vezes. Em 2022 venceu o segundo turno com 60,3 milhões de votos (50,90%), derrotando o então presidente Jair Bolsonaro.","fonte":"https://en.wikipedia.org/wiki/Luiz_In%C3%A1cio_Lula_da_Silva"}],"neg":[{"texto":"Foi condenado na Lava Jato nos casos do tríplex do Guarujá (8 anos e 10 meses) e do sítio de Atibaia (17 anos) e ficou preso por 580 dias. As condenações foram anuladas em 8 de março de 2021 pelo ministro Edson Fachin, do STF, que considerou a 13ª Vara de Curitiba incompetente para julgar os casos. Lula sempre negou as acusações e não tem condenação em vigor.","fonte":"https://agenciabrasil.ebc.com.br/justica/noticia/2021-03/fachin-anula-condenacoes-de-lula-na-lava-jato"},{"texto":"O esquema de descontos indevidos em benefícios do INSS cresceu durante o atual governo: os descontos associativos passaram de R$ 1,66 bilhão em 2023 para R$ 3,5 bilhões em 2024, segundo o relatório da CPMI. O relatório, que pedia o indiciamento de 216 pessoas, entre elas um filho do presidente e um ex-ministro, foi rejeitado por 19 votos a 12 em 28 de março de 2026. Lula não é investigado no caso, a defesa do filho chamou o pedido de eleitoral e o governo diz que barrou o esquema e ressarciu aposentados.","fonte":"https://agenciabrasil.ebc.com.br/politica/noticia/2026-03/cpmi-do-inss-termina-sem-relatorio-final"},{"texto":"A dívida bruta chegou a 82,9% do PIB em agosto de 2026, maior nível em cinco anos, segundo o Banco Central. Eram 71,68% em dezembro de 2022. O déficit primário acumulado de janeiro a agosto foi de 0,99% do PIB. O Tesouro projeta pico de 87,9% em 2029 e queda depois disso.","fonte":"https://otempo.com.br/economia/2026/9/30/divida-bruta-do-brasil-atinge-82-9-do-pib-em-agosto-maior-nivel-em-cinco-anos-mostra-bc"},{"texto":"O escândalo do mensalão, esquema de compra de apoio parlamentar, ocorreu no primeiro mandato e levou à condenação de aliados como o ex-ministro José Dirceu. Lula não foi denunciado e disse que não sabia do esquema.","fonte":"https://en.wikipedia.org/wiki/Luiz_In%C3%A1cio_Lula_da_Silva"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/taxa-de-desemprego-cai-para-53-menor-para-o-trimestre-ate-agosto","https://www.gov.br/mds/pt-br/noticias-e-conteudos/desenvolvimento-social/noticias-desenvolvimento-social/brasil-sai-do-mapa-da-fome-da-onu-conquista-historica-reflete-politicas-publicas-eficazes","https://www12.senado.leg.br/radio/1/noticia/2025/11/26/isencao-do-imposto-de-renda-para-quem-ganha-ate-r-5-mil-e-sancionada","https://en.wikipedia.org/wiki/Luiz_In%C3%A1cio_Lula_da_Silva","https://agenciabrasil.ebc.com.br/justica/noticia/2021-03/fachin-anula-condenacoes-de-lula-na-lava-jato","https://agenciabrasil.ebc.com.br/politica/noticia/2026-03/cpmi-do-inss-termina-sem-relatorio-final","https://www.gazetadopovo.com.br/republica/relatorio-da-cpmi-aponta-participacao-de-altos-escaloes-que-encobriam-assalto-a-aposentados/","https://otempo.com.br/economia/2026/9/30/divida-bruta-do-brasil-atinge-82-9-do-pib-em-agosto-maior-nivel-em-cinco-anos-mostra-bc"],"vice":"Geraldo Alckmin (PSB)","partidos":["PT","PCdoB","PV","PSB","PDT","PSOL","Rede"],"prop":[{"tema":"Trabalho","texto":"Acabar com a escala 6x1 e reduzir a jornada semanal para 40 horas, sem corte de salários.","fonte":"https://www.band.com.br/politica/eleicoes/eleicoes-2026-conheca-o-perfil-e-as-principais-propostas-de-lula-pt"},{"tema":"Economia","texto":"Manter a valorização do salário mínimo com reajustes acima da inflação e isentar de impostos a cesta básica.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Segurança","texto":"Criar o Ministério da Segurança Pública para coordenar o combate ao crime organizado e adotar padrões nacionais para câmeras corporais.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Saúde","texto":"Ampliar a rede pública de prevenção, diagnóstico e tratamento do câncer e incluir exames laboratoriais no Farmácia Popular.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Educação","texto":"Chegar a 80% das crianças alfabetizadas na idade certa, ampliar o ensino em tempo integral, as vagas em creches e os institutos federais.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principai i/Fl%C3%A1vio_Bolsonaro"},{"texto":"Foi eleito presidente da Comissão de Segurança Pública do Senado em 19 de fevereiro de 2025.","fonte":"https://www12.senado.leg.br/noticias/materias/2025/02/19/flavio-bolsonaro-e-eleito-presidente-da-csp"},{"texto":"Foi relator do projeto que acabou com as saídas temporárias de presos, aprovado em 2024.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/"},{"texto":"É coautor de duas propostas que viraram lei: a isenção de IPVA para veículos com mais de 20 anos e a lei de fomento ao microcrédito (PL 3.190/2023). Como deputado estadual, cerca de 24% das suas 208 proposições viraram lei.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/"}],"neg":[{"texto":"Foi denunciado pelo Ministério Público do Rio em novembro de 2020 por organização criminosa, lavagem de dinheiro e peculato no caso das rachadinhas, sobre suposto desvio de salários de assessores na Alerj. O STJ anulou decisões e provas, e o TJ-RJ arquivou a denúncia em maio de 2022. Em 26 de fevereiro de 2025, o ministro Gilmar Mendes negou recursos do MP e manteve o arquivamento. Flávio sempre negou as acusações. Não houve julgamento do mérito.","fonte":"https://www.infomoney.com.br/politica/gilmar-nega-recursos-e-mantem-arquivado-caso-das-rachadinhas-de-flavio-bolsonaro/"},{"texto":"É investigado em inquérito aberto em 22 de julho de 2026 pelo ministro André Mendonça, do STF, sobre o financiamento do filme Dark Horse, cinebiografia do pai. A PF apura suspeitas de lavagem de dinheiro, evasão de divisas e corrupção em repasses do banqueiro Daniel Vorcaro, do Banco Master, que somariam R$ 61 milhões. Flávio admite ter pedido recursos a Vorcaro, mas nega irregularidade. Não há denúncia.","fonte":"https://www.cnnbrasil.com.br/blogs/teo-cury/politica/flavio-bolsonaro-e-investigado-no-stf-sobre-financiamento-de-dark-horse/"},{"texto":"Em sete anos de Senado apresentou 57 projetos de lei, com foco em segurança pública, mas nenhuma proposta própria nessa área virou lei, segundo levantamento da Folhapress.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/"},{"texto":"Foi multado pelo TSE por divulgar informações falsas sobre Lula na campanha de 2022 e sobre o chamado kit gay em 2018.","fonte":"https://pt.wikipedia.org/wiki/Fl%C3%A1vio_Bolsonaro"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://pt.wikipedia.org/wiki/Fl%C3%A1vio_Bolsonaro","https://en.wikipedia.org/wiki/Fl%C3%A1vio_Bolsonaro","https://www25.senado.leg.br/web/senadores/senador/-/perfil/5894","https://www12.senado.leg.br/noticias/materias/2025/02/19/flavio-bolsonaro-e-eleito-presidente-da-csp","https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/","https://www.brasildefato.com.br/2026/04/02/em-sete-anos-flavio-bolsonaro-teve-apenas-um-projeto-de-lei-aprovado-no-congresso/","https://www.infomoney.com.br/politica/gilmar-nega-recursos-e-mantem-arquivado-caso-das-rachadinhas-de-flavio-bolsonaro/","https://www.cnnbrasil.com.br/blogs/teo-cury/politica/flavio-bolsonaro-e-investigado-no-stf-sobre-financiamento-de-dark-horse/","https://diariocarioca.com/2026/09/30/politica/eleicoes/investigacao-de-flavio-bolsonaro-no-caso-dark-horse-pode-ser-suspensa-se-ele-for-eleito"],"vice":"Alfredo Gaspar (PL)","partidos":null,"prop":[{"tema":"Segurança","texto":"Reduzir a maioridade penal de 18 para 16 anos, classificar facções como organizações narcoterroristas e construir cinco presídios federais de segurança máxima.","fonte":"https://www.correiobraziliense.com.br/politica/2026/08/7480363-veja-os-principais-pontos-do-programa-de-governo-de-flavio-bolsonaro.html"},{"tema":"Economia","texto":"Cortar pelo menos dez ministérios, reduzir impostos e retomar o Programa Nacional de Desestatização.","fonte":"https://www.correiobraziliense.com.br/politica/2026/08/7480363-veja-os-principais-pontos-do-programa-de-governo-de-flavio-bolsonaro.html"},{"tema":"Saúde","texto":"Reformular o financiamento do SUS, contratar serviços privados em horários ociosos, criar prontuário eletrônico único e expandir a telemedicina.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Educação","texto":"Ampliar as escolas cívico-militares, adotar o método fônico de alfabetização e criar vouchers para escolas particulares.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Instituições","texto":"Acabar com a reeleição para presidente, limitar decisões monocráticas e retirar competências criminais do STF, além de anistiar os condenados pelo 8 de janeiro.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Meio ambiente","texto":"Zerar o desmatamento ilegal até 2029, com fiscalização por satélites e inteligência artificial, e criar um mercado regulado de carbono.","fonte":"https://portalamazonia.com/amazonia/planos-governo-presidencia-amazonia-26/"}]},{"id":"augusto-cury","cargo":"presidente","t2":"Votos tendem a se dividir","nome":"Augusto Cury","urna":"Escritor Augusto Cury","num":"70","partido":"Avante","sit":"Deferido","colig":"Brasil dos Nossos Sonhos","foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADhAKEDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBA a/","pos_":[{"texto":"Vendeu mais de 40 milhões de livros, publicados em mais de 70 países, segundo a CNN Brasil.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-o-escritor-augusto-cury-candidato-do-avante-a-presidencia/"},{"texto":"O Vendedor de Sonhos passou de 2,5 milhões de exemplares e foi adaptado para o cinema.","fonte":"https://www.gazetadopovo.com.br/ideias/como-augusto-cury-ergueu-imperio-comercial-com-teoria-controversa/"},{"texto":"Criou em 2010 a Escola da Inteligência, programa que chegou a cerca de 900 escolas particulares e 330 mil alunos. Em 2020, a Arco Educação comprou 60% do negócio por R$ 288 milhões.","fonte":"https://www.gazetadopovo.com.br/ideias/como-augusto-cury-ergueu-imperio-comercial-com-teoria-controversa/"},{"texto":"Depois do debate de 22 de agosto de 2026, tornou-se o primeiro candidato da chamada terceira via a alcançar dois dígitos nas pesquisas, segundo a CNN Brasil.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-o-escritor-augusto-cury-candidato-do-avante-a-presidencia/"}],"neg":[{"texto":"Cinco psiquiatras ouvidos pela Folha de S.Paulo disseram que a Teoria da Inteligência Multifocal não tem validação científica nem uso na prática clínica. Cury responde que milhares de pessoas aplicam a teoria e que a psicanálise e a terapia cognitivo-comportamental também são questionadas.","fonte":"https://jornaldebrasilia.com.br/noticias/brasil/augusto-cury-mira-empreendedores-nega-inspiracao-em-marcal-e-tem-teoria-questionada/"},{"texto":"Escreveu que a sua teoria poderia resolver casos de autismo, condição que não tem cura, o que foi criticado por especialistas. Ele diz que falava em resolução e tratamento, não em cura.","fonte":"https://jornaldebrasilia.com.br/noticias/brasil/augusto-cury-mira-empreendedores-nega-inspiracao-em-marcal-e-tem-teoria-questionada/"},{"texto":"O plano de governo cita um doutorado de 2013 em Psicologia Multifocal pela Florida Christian University, mas o currículo dele no CNPq registra doutorado em /#/candidato/BR/BR/20322002026/280002551932/2026/BR","completo":"Ronaldo Ramos Caiado","idade":77,"natural":"Anápolis (GO)","ocup":"Médico ortopedista e produtor rural","atual":"Ex-governador de Goiás (2019 a março de 2026)","bio":"Caiado é médico e fundou em 1985 a União Democrática Ruralista (UDR), que presidiu até 1989, ano em que disputou a Presidência pela primeira vez e teve 0,72% dos votos. Foi deputado federal por cinco mandatos e senador por Goiás. Governou o estado de 2019 até 31 de março de 2026, quando deixou o cargo para concorrer ao Planalto pelo PSD. O vice na chapa é Gilberto Kassab.","esp":"centro-direita","espBase":"Classificação usada pelo InfoMoney no perfil dos candidatos de 2026. A trajetória dele é ligada à bancada ruralista e a partidos como PFL, DEM e União Brasil.","espFonte":"https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","pos_":[{"texto":"Goiás teve queda de 58,4% nos homicídios entre 2014 e 2024, a segunda maior do país, segundo o Atlas da Violência 2026 (Ipea e Fórum Brasileiro de Segurança Pública). De 2019 a 2024, período do governo dele, a taxa caiu 43%.","fonte":"https://www.maisgoias.com.br/politica/goias-registra-queda-de-quase-60-nos-homicidios-em-dez-anos/"},{"texto":"Era o governador mais bem avaliado entre os estados pesquisados pela Quaest em dezembro de 2024, com 88% de aprovação.","fonte":"https://www.infomoney.com.br/politica/quaest-condenado-pela-justica-eleitoral-caiado-e-o-governador-mais-bem-avaliado/"},{"texto":"Foi eleito governador no primeiro turno duas vezes: em 2018, com 59,73% dos votos, e em 2022, com 51,81%.","fonte":"https://pt.wikipedia.org/wiki/Ronaldo_Caiado"},{"texto":"Foi escolhido melhor senador de 2015 no prêmio do Congresso em Foco.","fonte":"https://pt.wikipedia.org/wiki/Ronaldo_Caiado"}],"neg":[{"texto":"Foi condenado em primeira instância pela Justiça Eleitoral em dezembro de 2024 por abuso de poder político, por usar a sede do governo em eventos de apoio a Sandro Mabel na eleição de Goiânia, e declarado inelegível por oito anos. Em 8 de abril de 2025, o TRE-GO derrubou a inelegibilidade por unanimidade, mas manteve multa de R$ 60 mil por conduta vedada. A defesa disse que foram reuniões fechadas, sem impacto eleitoral. Cabia recurso ao TSE.","fonte":"https://agenciabrasil.ebc.com.br/justica/noticia/2025-04/tre-go-afasta-inelegibilidade-de-governador-ronaldo-caiado"},{"texto":"Deixou o governo com pelo menos dez parentes em cargos comissionados, segundo o Poder360. A assessoria dele afirmou que todos têm qualificação técnica e exercem as funções sem irregularidade.","fonte":"https://www.poder360.com.br/poder-eleicoes/caiado-deixa-governo-de-goias-com-ao-menos-10-parentes-em-cargos/"},{"texto":"As mortes por ação policial em Goiás subiram de 429 em 2018 para mais de 500 por ano de 2019 a 2023. Em 2022 foram 538, o equivalente a 30,2% das mortes violentas intencionais no estado, segundo levantamento da Folhapress. O governo destaca a queda geral dos indicadores de criminalidade.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/com-alta-de-letalidade-policial-gestao-caiado-acumula-polemicas-na-seguranca-em-goias/"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://pt.wikipedia.org/wiki/Ronaldo_Caiado","https://en.wikipedia.org/wiki/Ronaldo_Caiado","https://www.maisgoias.com.br/politica/goias-registra-queda-de-quase-60-nos-homicidios-em-dez-anos/","https://www.infomoney.com.br/politica/quaest-condenado-pela-justica-eleitoral-caiado-e-o-governador-mais-bem-avaliado/","https://agenciabrasil.ebc.com.br/justica/noticia/2025-04/tre-go-afasta-inelegibilidade-de-governador-ronaldo-caiado","https://www.poder360.com.br/poder-eleicoes/caiado-deixa-governo-de-goias-com-ao-menos-10-parentes-em-cargos/","https://jornaldebrasilia.com.br/noticias/politica-e-poder/com-alta-de-letalidade-policial-gestao-caiado-acumula-polemicas-na-seguranca-em-goias/","https: aprovado pelo TSE em novembro de 2025, tornando-se o 30º partido do país.","fonte":"https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/"},{"texto":"Pesquisa AtlasIntel/Bloomberg de julho de 2026 registrou 7,8% das intenções de voto para ele, com 38% entre eleitores de 16 a 24 anos. O Datafolha apontou 3%.","fonte":"https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/"}],"neg":[{"texto":"É investigado pelo Ministério Público de São Paulo, junto com familiares, por suspeita de lavagem de dinheiro com uso de empresas de fachada. A apuração vem de operação de julho de 2020 e foi ampliada em 2022; segundo o Metrópoles, uma denúncia anterior por tráfico de influência foi rejeitada pela Justiça. A defesa afirma que ele refuta qualquer ato ilícito e está à disposição das autoridades.","fonte":"https://www.metropoles.com/brasil/entenda-por-que-promotoria-investiga-lavagem-de-dinheiro-no-mbl"},{"texto":"Em decisão publicada em 9 de setembro de 2026, a Justiça Federal rejeitou o pedido para reconhecer a prescrição e excluí-lo de cobranças de impostos da Martin Artefatos de Metal, que deve R$ 1,17 milhão. Ele diz que saiu da empresa em 2022 por ordem judicial e que não responde por dívidas geradas por outros sócios.","fonte":"https://iclnoticias.com.br/justica-confirma-dividas-de-renan-santos/"},{"texto":"Reportagens do UOL (2016) e do Metrópoles (2022) apontaram dezenas de processos e dívidas tributárias e trabalhistas ligadas a empresas da família. Em 2022 a dívida dele com a União era estimada em R$ 6,3 milhões.","fonte":"https://en.wikipedia.org/wiki/Renan_Santos"},{"texto":"A Agência Pública registrou declarações criticadas por ele, como a de fevereiro de 2024 em que disse que \"não existe essa conversa de democracia\", além de propostas como restringir o voto de beneficiários do Bolsa Família e decretar estado de sítio no primeiro dia de governo.","fonte":"https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/"}],"fontes":["https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-renan-santos-candidato-do-partido-missao-a-presidencia","https://en.wikipedia.org/wiki/Renan_Santos","https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/","https://www.metropoles.com/brasil/entenda-por-que-promotoria-investiga-lavagem-de-dinheiro-no-mbl","https://iclnoticias.com.br/justica-confirma-dividas-de-renan-santos/"],"vice":"Coronel Medina (Missão)","partidos":null,"prop":[{"tema":"Economia","texto":"Aprovar uma PEC de transição fiscal que desvincula os pisos de saúde e educação da receita e revê benefícios tributários, com economia estimada em R$ 1,1 trilhão até 2031.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Estado","texto":"Reduzir o número de municípios de 5.570 para cerca de 1.656 e privatizar os Correios.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Segurança","texto":"Adotar política de guerra contra as facções com apoio das Forças Armadas, reduzir a maioridade penal e ampliar o acesso da população a armas.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Saúde","texto":"Criar prontuário único no SUS com inteligência artificial, oferecer Ozempic na rede pública e legalizar o uso terapêutico de canabidiol e psilocibina.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Infraestrutura","texto":"Elevar o investimento em infraestrutura a até 4% do PIB, com prioridade para ferrovias.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Defesa","texto":"Desenvolver armamento nuclear brasileiro e formar uma reserva estratégica em Bitcoin.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"}]},{"id":"zema","cargo":"presidente","t2":"Maioria tende a Flávio Bolsonaro","nome":"Romeu Zema","urna":"Zema","num":"30","partido":"Novo","sit":"Deferido","colig":null,"foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADhAKEDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD3cnFNJppNNJqCrCk03NFJmgYE0ZpM0ySRUUsxwAMk0gHEionnjjBLOAB15rida8deVI8FnD93I3sen4VyMmv3l4zNLcMByT81K47Hq8msWSdbhPzrP/4Sa1BJZwBnAry+W7dZQzPwehB4NR3F+Y7jG7jjFILHrqa5ZMQPPXkZqY6laAZ+0R+v3q8h/tU+VuBx83PvSHUTI5AY7V5phY9nWRZFyrAg+lBrynTtevbRkKSsUH8JPWvQ9J1aPUrZXGFk6MvoaANA0lKaSgBpppNONRt1oACaTdTTRSAduoptFAG4aSmlqTNWIdmkJpuaKQBmuZ8XawtpZNbIf3kinPP3RXSOwVST2FeNeKdY+06tPIzkbW2qPYUMEYlxIRIcknJqqLlC3HY457f/AFqgmvw7Ad/THWkkQSr8g57npUtlpNl1roSW5Q8FCcfSqlzIXZG5PTNNhtJ2OCOKtppc7jBzx2qHJGkabZXefbblR/E3WmW1wy5Un5T1q/JokrpjdjHQVTk0i5Rsc7RQpoHSkjUtrvzJARjIxgV1Xh/U/sWoRl2/dPwxrhI4pIOuVxWzYTs8RT9apO5Di1uezKwZQwOQRkUtZPhu5a60OB3OWGVz9DWselUQNNRmnmmGgBppKU9aQ0gG5opKKANgtS7qjzRmqEPzSZpuaM0AMupAlrKx4AQnNfPGtXDGSeb+HeTn15r3zWXZdHuyg5ETY/Kvn7XYmMDoPvZ59qQ0 ão anterior.","fonte":"https://www.em.com.br/colunistas/ana-mendonca/2026/01/7324953-zema-prometeu-arrumar-a-casa-o-que-minas-entrega-em-2026.html"},{"texto":"Foi reeleito governador no primeiro turno em 2022, depois de vencer em 2018 partindo de cerca de 3% nas pesquisas.","fonte":"https://www.infomoney.com.br/perfil/romeu-zema/"},{"texto":"Fechou em 2021 o acordo de R$ 37,68 bilhões com a Vale para reparar os danos do rompimento da barragem de Brumadinho.","fonte":"https://pt.wikipedia.org/wiki/Romeu_Zema"},{"texto":"Aprovou reforma administrativa em 2019, que reduziu as secretarias de 21 para 12, e reforma da previdência estadual em 2020.","fonte":"https://pt.wikipedia.org/wiki/Romeu_Zema"}],"neg":[{"texto":"A dívida pública de Minas passou de R$ 200 bilhões e continuou crescendo durante seu governo, apesar dos superávits. As forças de segurança acumulam perdas salariais sem recomposição integral.","fonte":"https://www.em.com.br/colunistas/ana-mendonca/2026/01/7324953-zema-prometeu-arrumar-a-casa-o-que-minas-entrega-em-2026.html"},{"texto":"Em 4 de março de 2026, a deputada Dandara (PT-MG) pediu ao Ministério Público de Minas a abertura de inquérito civil sobre cerca de R$ 128 bilhões em renúncias fiscais de 2017 a 2024. É um pedido de investigação, sem acusação formal; Zema não respondeu ao Poder360 até a publicação.","fonte":"https://www.poder360.com.br/poder-congresso/deputada-pede-investigacao-contra-zema-por-renuncias-fiscais/"},{"texto":"O InfoMoney cita como desgastes os incentivos fiscais concedidos à Eletrozema, empresa da família, e a doação de R$ 1 milhão do pai de Daniel Vorcaro, do Banco Master, ao Novo na campanha de 2022.","fonte":"https://www.infomoney.com.br/perfil/romeu-zema/"},{"texto":"Em 1º de maio de 2026 lamentou em um podcast que crianças não possam trabalhar no Brasil e disse que mudaria a regra, o que gerou forte reação. No dia seguinte afirmou defender mais oportunidades para adolescentes, com proteção e sem prejuízo da escola.","fonte":"https://www.em.com.br/politica/2026/05/7410773-zema-defende-mais-oportunidade-de-trabalho-a-menores-de-idade-apos-criticas.html"},{"texto":"Foi multado pelo TSE em maio de 2024 por propaganda eleitoral antecipada na campanha de 2022. Também foi criticado por dizer, em 2020, que a violência doméstica seria um instinto natural do ser humano e, em 2023, por falas sobre Sul e Sudeste em relação a Norte e Nordeste.","fonte":"https://pt.wikipedia.org/wiki/Romeu_Zema"}],"fontes":["https://www.infomoney.com.br/perfil/romeu-zema/","https://en.wikipedia.org/wiki/Romeu_Zema","https://pt.wikipedia.org/wiki/Romeu_Zema","https://www.em.com.br/colunistas/ana-mendonca/2026/01/7324953-zema-prometeu-arrumar-a-casa-o-que-minas-entrega-em-2026.html","https://www.poder360.com.br/poder-congresso/deputada-pede-investigacao-contra-zema-por-renuncias-fiscais/","https://www.em.com.br/politica/2026/05/7410773-zema-defende-mais-oportunidade-de-trabalho-a-menores-de-idade-apos-criticas.html"],"vice":"Eduardo Girão (Novo)","partidos":null,"prop":[{"tema":"Economia","texto":"Privatizar todas as estatais federais, cortar gastos públicos e reduzir impostos.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Trabalho","texto":"Criar um regime alternativo à CLT, com contratos e pagamentos diários, semanais ou quinzenais.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Segurança","texto":"Tratar facções como organizações terroristas, reduzir a maioridade penal e adotar política de encarceramento em massa.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Saúde","texto":"Ampliar parcerias com hospitais e clínicas particulares, as concessões a organizações sociais e a telemedicina.","fonte":"https://spdiario.com.br/noti  câncer infantil, e a de um sistema de acompanhamento de obras públicas.","fonte":"https://ndmais.com.br/politica/quem-e-luciano-zucco/"},{"texto":"Na Câmara, presidiu a CPI do MST em 2023 e ocupou os postos de líder e vice-líder da oposição.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-luciano-zucco-candidato-ao-governo-do-rio-grande-do-sul/"}],"neg":[{"texto":"Foi investigado por suposto incentivo a atos antidemocráticos após a eleição de 2022, por postagens sobre concentrações em frente a um quartel em Porto Alegre. Em 24 de julho de 2023 o ministro Alexandre de Moraes arquivou a apuração a pedido da PGR, porque os mesmos fatos já constavam de outro procedimento sobre bloqueios de rodovias, ao qual o material foi anexado. Zucco diz que sempre acreditou na própria inocência e que não cometeu crime.","fonte":"https://www.cnnbrasil.com.br/politica/moraes-arquiva-apuracao-contra-zucco-por-suposto-incentivo-a-atos-antidemocraticos/"},{"texto":"Votou a favor da chamada PEC da Blindagem em 16 de setembro de 2025, proposta que condiciona processos contra parlamentares à autorização do Congresso. O voto foi cobrado por Gabriel Souza no debate da RBS TV; Zucco respondeu criticando a atuação do STF contra políticos de direita.","fonte":"https://www.terra.com.br/noticias/brasil/politica/veja-quais-foram-os-deputados-gauchos-que-votaram-a-favor-de-pec-que-os-blinda-da-justica,13a0357283bdeb29321076ecaaea9d56mjn27laq.html"}],"fontes":["https://www.cnnbrasil.com.br/eleicoes/quem-sao-os-candidatos-a-governador-do-rio-grande-do-sul-em-2026/","https://www.cnnbrasil.com.br/eleicoes/quem-e-luciano-zucco-candidato-ao-governo-do-rio-grande-do-sul/","https://ndmais.com.br/politica/quem-e-luciano-zucco/","https://www.cnnbrasil.com.br/politica/moraes-arquiva-apuracao-contra-zucco-por-suposto-incentivo-a-atos-antidemocraticos/","https://agenciabrasil.ebc.com.br/justica/noticia/2023-07/pgr-pede-arquivamento-de-investigacao-contra-presidente-da-cpi-do-mst","https://www.terra.com.br/noticias/brasil/politica/veja-quais-foram-os-deputados-gauchos-que-votaram-a-favor-de-pec-que-os-blinda-da-justica,13a0357283bdeb29321076ecaaea9d56mjn27laq.html","https://brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv","https://en.wikipedia.org/wiki/Zucco_(politician)"],"vice":"Silvana Covatti (PP)","partidos":["PL","PP","União Brasil","Republicanos","Novo","Podemos","DC"],"prop":[{"tema":"Finanças","texto":"Promete cortar secretarias para reduzir o tamanho da máquina estadual e assume o compromisso de não aumentar impostos nem criar novas taxas.","fonte":"https://www.abcmais.com/politica/confira-as-propostas-de-zucco-juliana-brizola-gabriel-souza-e-maranata-para-o-rs/"},{"tema":"Dívida","texto":"Propõe renegociar a dívida do Estado com a União e criar um fundo constitucional para a região Sul.","fonte":"https://www.brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv/"},{"tema":"Enchentes","texto":"Quer um sistema integrado de monitoramento entre cidades da mesma bacia hidrográfica, simulados de evacuação em quase todos os municípios e a realocação de moradores de áreas de risco com moradia imediata.","fonte":"https://jovempan.com.br/politica/zucco-propoe-novo-sistema-contra-enchentes-no-rs-e-descarta-venda-do-banrisul/"},{"tema":"Segurança","texto":"Defende tolerância zero ao crime organizado, com controle dos presídios, bloqueio de comunicações ilícitas e combate a invasões de terra no campo.","fonte":"https://www.abcmais.com/politica/confira-as-propostas-de-zucco-juliana-brizola-gabriel-souza-e-maranata-para-o-rs/"},{"tema":"Educação","texto":"Propõe expandir as escolas cívico-militares e os Colégios Tiradentes da Brigada Militar, com foco em Língua Portuguesa e Matemática.","fonte":"https://www.abcmais.com/politica/confira-as-propostas-de-zucco-juliana-brizola-gabriel-souza-e-maranata-para-o-rs/"},{"tema":"Agro e Banrisul","texto":"Descarta privatizar o Banrisul, que pretende usar como motor do agronegócio, e propõe o plano de irrigação Irriga+RS e um Seguro Rural Estadual complementar ao federal.","fonte":"https://jovempan.com.br/politica/zucco-propoe-novo-sistema-contra-enchentes-no-rs-e-descarta-venda-do-banrisul/"}]},{"id":"juliana-brizola","cargo":"governador","t2":"Deve ir ao 2º turno","nome":"Juliana Brizola","urna":"Juliana Brizola","num":"12","partido":"PDT","sit":"Deferido","colig":"Com o Povo","foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADhAKEDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD31PuKfYU6mp9xfoKdQAUUUUAFFFFABRRRQAUVz2u+OPDnhwlNT1WCOYf8sVO+T/vkZNcdL8dvDSylUtb5o+gkZAB+Wc0Dsz1LNFfMfiH4xeJNU1WVtJumtbJW/drGMEj1JqfQPjV4m06dF1DZqEAPzq64fHsR3/OlcfKz6VorlfCfj/QvF8QFjceXdgZe0mIWQfQdx7iuqpkhRRRQAUUUUAFFFFAFTe394/nRTaKALafcX6CnU1PuL9BTqACiiigAoopOnJoArX9/a6XYTX19OkFrApeSRzgKK+c/H3xs1LWWex8PGSw045Vpj8sso+v8I9hzVf4wfER/Emu/2LYTEaRZybWweJ5QeW9wOg/E1keF/Ab6432u7dktN2I0HVx61E5qCuzSnTc3ZHHQGS6uN7yu8jH5m+8WNbj6XPLaASxbFx3GDn2r2vSfBGi6eieVZx7gOpHJ9/rXQtotm8YH2aLA6fL0rjli9dEdkcLZas+XpYXgRoxID6KKrMxGN4kjKniRR/nivqN/C+myfLJp9swPU+WM1k6t8N9H1CEiO1WFwOGUcfjVRxS6ol4bszwTTb5/tAeOUw30LAq8Z27sdwexr3/4cfFNdXaLRd .br/divulga/#/candidato/SUL/RS/20322002026/210002551508/2026/RS","completo":"Juliana Daudt Brizola","idade":51,"natural":"Porto Alegre (RS)","ocup":"Advogada","atual":"Ex-deputada estadual (2011-2023)","bio":"Neta de Leonel Brizola, nasceu em Porto Alegre em 1975 e passou parte da infância no Uruguai, durante o exílio da família. É advogada, com mestrado em Ciências Criminais pela PUCRS, e está no PDT desde os 18 anos. Foi vereadora de Porto Alegre, secretária municipal da Juventude e deputada estadual por três mandatos. Concorreu à prefeitura da Capital em 2020 e 2024 e agora disputa o governo com Edegar Pretto (PT) de vice.","esp":"centro-esquerda","espBase":"Baseado no posicionamento do PDT, partido trabalhista de centro-esquerda, e na chapa formada com o PT, que indicou o vice.","espFonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-juliana-brizola-candidata-ao-governo-do-rio-grande-do-sul/","pos_":[{"texto":"É autora da emenda à Constituição estadual que transformou a escola de tempo integral em política de Estado no Rio Grande do Sul.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-juliana-brizola-candidata-ao-governo-do-rio-grande-do-sul/"},{"texto":"Criou o programa Pró-Hospitais, que permite a empresas destinar até 5% do ICMS devido a hospitais filantrópicos.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-juliana-brizola-candidata-ao-governo-do-rio-grande-do-sul/"},{"texto":"Elegeu-se deputada estadual em 2010 com 61.305 votos e, em 2008, foi a vereadora mais votada do PDT em Porto Alegre.","fonte":"https://pt.wikipedia.org/wiki/Juliana_Brizola"}],"neg":[{"texto":"Em 23 de outubro de 2025 foi indiciada pela Polícia Civil por suposta apropriação de recursos da avó materna, de 99 anos, com base no Estatuto do Idoso, em investigação aberta a partir de denúncia de um tio. A defesa negou qualquer crime e tratou o caso como desavença familiar. Em 23 de julho de 2026 o Ministério Público do RS arquivou a investigação por não ver crime nem desvio de patrimônio, e a decisão foi acolhida pela Justiça.","fonte":"https://www.jornalrepercussao.com.br/geral/ministerio-publico-arquiva-investigacao-e-conclui-que-nao-houve-irregularidades-em-caso-envolvendo-avo-de-juliana-brizola"},{"texto":"No debate da RBS TV, na última semana de campanha, foi questionada por Gabriel Souza e por Zucco pela aliança com o PT e pela relação com o governo federal. Respondeu que não quer trazer a guerra de Brasília para o Estado, mas fazer as pazes com Brasília.","fonte":"https://brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv"}],"fontes":["https://www.cnnbrasil.com.br/eleicoes/quem-sao-os-candidatos-a-governador-do-rio-grande-do-sul-em-2026/","https://www.cnnbrasil.com.br/eleicoes/quem-e-juliana-brizola-candidata-ao-governo-do-rio-grande-do-sul/","https://pt.wikipedia.org/wiki/Juliana_Brizola","https://en.wikipedia.org/wiki/Juliana_Brizola","https://www.terra.com.br/noticias/brasil/cidades/juliana-brizola-e-indiciada-por-suposta-apropriacao-de-dinheiro-da-avo-de-99-anos,edae861a09156615d7bddb9b6cd2d780tlwi57nj.html","https://www.jornalrepercussao.com.br/geral/ministerio-publico-arquiva-investigacao-e-conclui-que-nao-houve-irregularidades-em-caso-envolvendo-avo-de-juliana-brizola","https://brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv"],"vice":"João Edegar Pretto (PT)","partidos":["PDT","PSB","Avante","PT","PCdoB","PV","PSOL","Rede"],"prop":[{"tema":"Finanças","texto":"Propõe negociar os encargos da dívida estadual e manter sob controle público o Banrisul, o Badesul e o BRDE.","fonte":"https://poa24horas.com.br/politica/2026/09/juliana-brizola-apresenta-propostas-para-economia-educacao-e-seguranca-no-rs/"},{"tema":"Educação","texto":"Quer implantar de forma gradual escolas de tempo integral no modelo dos CIEPs, cumprir o piso do magistério e firmar um pacto pela alfabetização com os 497 municípios.","fonte":"https://www.otempo.com.br/eleicoes/2026/candidatos/rio-grande-do-sul/governador/juliana-brizola-12"},{"tema":"Saúde","texto":"Promete aplicar integralmente os 12% da receita em saúde e montar forças-tarefas para zerar as filas de cirurgias eletivas.","fonte":"https://www.abcmais.com/politica/confira-as-propostas-de-zucco-juliana-brizola-gabriel-souza-e-maranata-para-o-rs/"},{"tema":"Enchentes","texto":"Propõe transformar a Defesa Civil em política permanente de prevenção de riscos climáticos e criar protocolos para orientar a população em eventos extremos.","fonte":"https://www.otempo.com.br/eleicoes/2026/candidatos/rio-grande-do-sul/governador/juliana-brizola-12"},{"tema":"Segurança","texto":"Defende criar um Centro Integrado de Inteligência de Fronteira, instalar bloqueadores de sinal e scanners nos presídios, recompor efetivos por concurso e criar o sistema RS Mulher Segura.","fonte":"https://www.otempo.com.br/eleicoes/2026/candidatos/rio-grande-do-sul/governador/juliana-brizola-12"},{"tema":"Agro e crédito","texto":"Quer retomar o Plano Safra Gaúcho, ampliar o crédito à agricultura familiar e criar o CrediGaúcho, com juros subsidiados para MEIs e microempresas.","fonte":"https://www.otempo.com.br/eleicoes/2026/candidatos/rio-grande-do-sul/governador/juliana-brizola-12"}]},{"id":"gabriel-souza","cargo":"governador","t2":"Votos tendem a se dividir entre Zucco e Juliana","nome":"Gabriel Souza","urna":"Gabriel Souza","num":"15","partido":"MDB","sit":"Deferido","colig":"Nosso Rio Grande Não Para","foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADhAKEDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1h //divulgacandcontas.tse.jus.br/divulga/#/candidato/SUL/RS/20322002026/210002542892/2026/RS","completo":"Gabriel Vieira de Souza","idade":42,"natural":"Porto Alegre (RS), segundo o registro citado pela CNN; a Wikipédia indica Tramandaí (RS)","ocup":"Médico veterinário","atual":"Vice-governador do Rio Grande do Sul","bio":"Veterinário formado pela Ulbra, é filiado ao MDB desde os 16 anos e foi secretário de Planejamento de Tramandaí. Elegeu-se deputado estadual em 2014 e 2018, foi líder do governo Sartori e presidiu a Assembleia Legislativa em 2021. É vice-governador de Eduardo Leite desde 2023 e concorre como candidato da continuidade, com Ernani Polo (PSD) de vice.","esp":"centro","espBase":"Baseado no posicionamento do MDB, partido de centro, e na condição de candidato do governo Eduardo Leite (PSD).","espFonte":"https://www.itatiaia.com.br/politica/eleicoes/conheca-a-carreira-politica-de-gabriel-souza-pre-candidato-ao-governo-do-rs/","pos_":[{"texto":"Presidiu a Assembleia Legislativa em 2021, quando conduziu a iniciativa RS Pós-Pandemia, voltada à retomada econômica.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-gabriel-souza-candidato-ao-governo-do-rio-grande-do-sul/"},{"texto":"Como vice-governador, coordenou o Gabinete de Crise do governo estadual durante as enchentes de 2024.","fonte":"https://www.itatiaia.com.br/politica/eleicoes/conheca-a-carreira-politica-de-gabriel-souza-pre-candidato-ao-governo-do-rs/"},{"texto":"Foi reeleito deputado estadual em 2018 com 52.953 votos, o mais votado do MDB naquela eleição.","fonte":"https://pt.wikipedia.org/wiki/Gabriel_Souza"}],"neg":[{"texto":"No debate da RBS TV, na última semana de campanha, adversários cobraram dele a fila de 853 mil pessoas à espera de procedimentos de saúde e a demora na execução das obras de reconstrução após as enchentes. Gabriel reconheceu as dificuldades fiscais, mas disse que o Estado voltou a ficar de pé.","fonte":"https://brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv"},{"texto":"Em março de 2026 o Cpers-Sindicato o criticou por dizer que nunca viu o sindicato ser a favor de algo bom para a educação, ao defender a política de bônus do governo Leite. A entidade afirma que o modelo exclui funcionários de escola e aposentados.","fonte":"https://cpers.com.br/vice-governador-gabriel-souza-distorce-a-realidade-para-justificar-politica-que-exclui-educadores/"}],"fontes":["https://www.cnnbrasil.com.br/eleicoes/quem-sao-os-candidatos-a-governador-do-rio-grande-do-sul-em-2026/","https://www.cnnbrasil.com.br/eleicoes/quem-e-gabriel-souza-candidato-ao-governo-do-rio-grande-do-sul/","https://www.itatiaia.com.br/politica/eleicoes/conheca-a-carreira-politica-de-gabriel-souza-pre-candidato-ao-governo-do-rs/","https://pt.wikipedia.org/wiki/Gabriel_Souza","https://en.wikipedia.org/wiki/Gabriel_Souza_(politician)","https://brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv","https://cpers.com.br/vice-governador-gabriel-souza-distorce-a-realidade-para-justificar-politica-que-exclui-educadores/"],"vice":"Ernani Polo (PSD)","partidos":["MDB","PSD","PRD","Solidariedade"],"prop":[{"tema":"Finanças","texto":"Propõe aderir ao Propag, o programa federal de pagamento das dívidas dos estados, para ampliar a capacidade de investimento, e manter a alíquota do ICMS em 17%.","fonte":"https://www.radiocaxias.com.br/eleicoes-2026-gabriel-souza-defende-continuidade-de-investimentos-e-novas-estrategias-para-infraestrutura-e-tributos-no-rs/"},{"tema":"Saúde","texto":"Promete zerar as filas do SUS no primeiro ano com investimento de R$ 5 bilhões e ampliar hemodiálise, oncologia, tomografia e ressonância no interior.","fonte":"https://www.brasildefato.com.br/2026/09/30/candidatos-ao-governo-do-estado-tem-embates-sobre-educacao-seguranca-e-reconstrucao-em-debate-na-rbs-tv/"},{"tema":"Educação","texto":"Promete 80 o-rs"},{"texto":"Foi apontado pelo júri do Prêmio Congresso em Foco como o melhor parlamentar na categoria Apoio ao Empreendedorismo.","fonte":"https://www.congressoemfoco.com.br/noticia/25012/marcel-van-hattem-e-o-melhor-parlamentar-na-categoria-apoio-ao-empreendedorismo-aponta-juri"},{"texto":"Votou contra a chamada PEC da Blindagem, que dificultava processos criminais contra parlamentares, em setembro de 2025.","fonte":"https://www.gaz.com.br/pec-da-blindagem-saiba-como-votaram-os-deputados-da-regiao/"}],"neg":[{"texto":"Denunciado pela PGR ao STF em abril de 2026 por crimes contra a honra (calúnia e injúria), por discurso de 2024 em que acusou o delegado da PF Fábio Alvarez Schor de fraudar relatório. Ele havia sido indiciado pela PF em novembro de 2024. O STF ainda precisa decidir se recebe a denúncia; o relator é Flávio Dino. A defesa diz que as falas ocorreram no exercício do mandato e estão cobertas pela imunidade parlamentar.","fonte":"https://www.poder360.com.br/poder-justica/pgr-denuncia-marcel-van-hattem-por-discurso-contra-delegado-da-pf/"},{"texto":"O Conselho de Ética da Câmara aprovou em 5 de maio de 2026, por 13 votos a 4, a suspensão do seu mandato por 60 dias pela ocupação da Mesa Diretora em agosto de 2025, em protesto pela anistia aos condenados do 8 de janeiro. Ele recorreu à CCJ e a palavra final cabe ao plenário. Van Hattem chama o processo de perseguição política.","fonte":"https://www.camara.leg.br/noticias/1269254-conselho-de-etica-aprova-60-dias-de-suspensao-para-tres-deputados-por-ocupacao-do-plenario/"}],"fontes":["https://www12.senado.leg.br/noticias/candidatos-2026/rio-grande-do-sul","https://www.cnnbrasil.com.br/eleicoes/quem-e-marcel-van-hattem-candidato-ao-senado-pelo-rio-grande-do-sul/","https://pt.wikipedia.org/wiki/Marcel_van_Hattem","https://www.congressoemfoco.com.br/noticia/111161/marcel-van-hattem-e-eleito-melhor-deputado-federal-do-rs","https://www.congressoemfoco.com.br/noticia/25012/marcel-van-hattem-e-o-melhor-parlamentar-na-categoria-apoio-ao-empreendedorismo-aponta-juri","https://www.poder360.com.br/poder-justica/pgr-denuncia-marcel-van-hattem-por-discurso-contra-delegado-da-pf/","https://www.gazetadopovo.com.br/republica/pgr-denuncia-van-hattem-por-acusar-delegado-da-pf-de-fraude/","https://www.camara.leg.br/noticias/1269254-conselho-de-etica-aprova-60-dias-de-suspensao-para-tres-deputados-por-ocupacao-do-plenario/","https://jornaldebrasilia.com.br/noticias/politica-e-poder/deputados-suspensos-por-ocupar-a-mesa-da-camara-recorrem-a-ccj-para-reverter-decisao/","https://www.gaz.com.br/pec-da-blindagem-saiba-como-votaram-os-deputados-da-regiao/"],"sup":"Sérgio Turra (PP) e Ricardo Jobim (Novo)","prop":[{"tema":"STF","texto":"Defende eleger uma maioria de 41 senadores para escolher um presidente do Senado que paute o impeachment de ministros do STF e quer mudar os critérios de escolha dos ministros.","fonte":"https://ndmais.com.br/politica/van-hattem-impeachment-ministros-stf-41-senadores/"},{"tema":"Impostos","texto":"É contra o aumento da carga tributária, critica a reforma tributária aprovada e propõe reduzir impostos, burocracia e cortar privilégios como os supersalários.","fonte":"https://www.radiocaxias.com.br/marcel-van-hattem-defende-mudancas-no-stf-e-endurecimento-da-legislacao-penal-em-entrevista/"},{"tema":"Saúde","texto":"Propõe prazo máximo para consultas e exames no SUS, com atendimento na rede privada pago pelo poder público quando o prazo não for cumprido.","fonte":"https://www.radiocaxias.com.br/marcel-van-hattem-defende-mudancas-no-stf-e-endurecimento-da-legislacao-penal-em-entrevista/"},{"tema":"Segurança","texto":"Defende penas mais duras para crimes graves como feminicídio e crimes sexuais, mais rigor com reincidentes e restrição de benefícios a presos.","fonte":"https://www.radiocaxias.com.br/marcel-van-hattem-defende-mudancas-no-stf-e-endurecimento-da-legislacao-penal-em-entrevista/"},{"tema":"Escala 6x1","texto":"Defende que o trabalhador possa escolher a pró 22.","fonte":"https://en.wikipedia.org/wiki/Sanderson_(politician)"},{"texto":"Ocupa desde fevereiro de 2025 o posto de 1º vice-líder da oposição na Câmara, depois de ter sido vice-líder de bancada no PSL e no PL.","fonte":"https://www.camara.leg.br/deputados/204416/biografia"}],"neg":[{"texto":"Votou a favor da chamada PEC da Blindagem, aprovada na Câmara em 16 de setembro de 2025. O texto dificultava a abertura de processos criminais e a prisão de deputados e senadores.","fonte":"https://sintrajufe.org.br/com-o-voto-de-17-deputados-gauchos-pec-da-blindagem-e-aprovada-na-camara-dos-deputados-e-vai-ao-senado-entenda-medidas-e-veja-quem-votou-a-favor-e-contra/"},{"texto":"Seu histórico de votações inclui posições criticadas por ambientalistas e pela oposição da época, como o voto contra criminalizar responsáveis por rompimento de barragens e a favor da MP 910, apelidada de MP da grilagem.","fonte":"https://pt.wikipedia.org/wiki/Ubiratan_Sanderson"}],"fontes":["https://www12.senado.leg.br/noticias/candidatos-2026/rio-grande-do-sul","https://www.cnnbrasil.com.br/eleicoes/quem-e-sanderson-candidato-ao-senado-pelo-rio-grande-do-sul/","https://www.camara.leg.br/deputados/204416/biografia","https://www.camara.leg.br/noticias/944989-sanderson-e-eleito-presidente-da-comissao-de","https://pt.wikipedia.org/wiki/Ubiratan_Sanderson","https://en.wikipedia.org/wiki/Sanderson_(politician)","https://sintrajufe.org.br/com-o-voto-de-17-deputados-gauchos-pec-da-blindagem-e-aprovada-na-camara-dos-deputados-e-vai-ao-senado-entenda-medidas-e-veja-quem-votou-a-favor-e-contra/","https://www.gaz.com.br/pec-da-blindagem-saiba-como-votaram-os-deputados-da-regiao/"],"sup":"Ireneu Orth (PP) e Ernâni Mello (PL)","prop":[{"tema":"Dívida do RS","texto":"Defende prorrogar a suspensão do pagamento da dívida do Estado com a União e é coautor de projeto que adia a retomada das parcelas.","fonte":"https://www.radiocaxias.com.br/eleicoes-2026-sanderson-defende-revisao-da-reforma-tributaria-e-renegociacao anos. Cumpriu dois mandatos de deputada federal (2007-2015) e um de deputada estadual. Em 2018 foi candidata a vice-presidente na chapa de Fernando Haddad. Disputou a prefeitura de Porto Alegre três vezes sem vencer. Deixou o PCdoB em 2024, depois de 25 anos, e filiou-se ao PSOL no fim de 2025.","esp":"esquerda","espBase":"Fez carreira no PCdoB e hoje está no PSOL, partidos de esquerda, e a imprensa a descreve como liderança desse campo.","espFonte":"https://www.cnnbrasil.com.br/politica/psol-anuncia-filiacao-de-manuela-davila-e-disputa-pelo-senado-no-rs/","pos_":[{"texto":"Foi a deputada federal mais votada do RS em 2006 e em 2010. Em 2010 recebeu 482.590 votos.","fonte":"https://vermelho.org.br/2010/10/08/manuela-a-deputada-mais-votada-do-rio-grande-do-sul/"},{"texto":"Foi relatora na Câmara do Estatuto da Juventude, sancionado em agosto de 2013.","fonte":"https://www.camara.leg.br/noticias/410674-sancionado-estatuto-da-juventude-com-vetos/"},{"texto":"Relatou também a Lei do Estágio e presidiu a Frente Parlamentar pela Liberdade na Internet.","fonte":"https://vermelho.org.br/2010/10/08/manuela-a-deputada-mais-votada-do-rio-grande-do-sul/"},{"texto":"Em 2014 foi a deputada estadual mais votada do Rio Grande do Sul e, em 2013, liderou a bancada do PCdoB na Câmara.","fonte":"https://en.wikipedia.org/wiki/Manuela_d%27%C3%81vila"}],"neg":[{"texto":"Em 2019, foi quem passou ao hacker Walter Delgatti o contato do jornalista Glenn Greenwald, no caso das mensagens da Lava Jato. Ela confirmou o fato em nota, disse que teve o celular invadido, que não conhecia o hacker e que suspeitou de armadilha de adversários. Colocou o aparelho à disposição da PF. As fontes consultadas não registram acusação formal contra ela.","fonte":"https://exame.com/brasil/hacker-diz-que-manuela-davila-intermediou-contato-com-greenwald/"},{"texto":"Seu nome apareceu com o codinome Avião em planilhas da Odebrecht apreendidas pela PF e divulgadas em março de 2016, na Lava Jato. Ela nega irregularidad l.com.br/eleicoes/quem-e-pimenta-candidato-ao-senado-pelo-rio-grande-do-sul/"},{"texto":"Teve papel na criação da Universidade Federal do Pampa (Unipampa).","fonte":"https://pt.wikipedia.org/wiki/Paulo_Pimenta"}],"neg":[{"texto":"Foi demitido da Secom por Lula em janeiro de 2025, depois de críticas seguidas à comunicação do governo, e substituído por Sidônio Palmeira. Pimenta disse que o presidente queria alguém com outro perfil no cargo.","fonte":"https://www.brasildefato.com.br/2025/01/07/lula-demite-paulo-pimenta-da-secom-estamos-comecando-um-segundo-tempo-diz-sidonio-palmeira-novo-ministro/"},{"texto":"Em maio de 2024, a oposição o acusou de usar um inquérito da PF sobre desinformação nas enchentes para perseguir críticos do governo. A CCJ da Câmara aprovou convite para que ele se explicasse.","fonte":"https://jovempan.com.br/politica/ccj-da-camara-convida-paulo-pimenta-para-explicar-inquerito-de-fake-news-sobre-enchentes-no-rs/"},{"texto":"Foi investigado por mais de dez anos em inquérito sobre suposta falsificação de documentos e lavagem de dinheiro ligado a uma empresa de São Borja. Não houve denúncia. Em 14 de outubro de 2020, o TRF-4 trancou o inquérito por unanimidade, por falta de indícios e excesso de prazo. Pimenta sempre negou envolvimento e atribuiu o caso a ataque político.","fonte":"https://www.trf4.jus.br/trf4/controlador.php?acao=noticia_visualizar&id_noticia=15502"},{"texto":"Em 2005, renunciou à vice-presidência da CPI do Mensalão depois da polêmica com uma lista de supostos beneficiários de Marcos Valério que ele apresentou.","fonte":"https://pt.wikipedia.org/wiki/Paulo_Pimenta"}],"fontes":["https://www12.senado.leg.br/noticias/candidatos-2026/rio-grande-do-sul","https://www.cnnbrasil.com.br/eleicoes/quem-e-pimenta-candidato-ao-senado-pelo-rio-grande-do-sul/","https://pt.wikipedia.org/wiki/Paulo_Pimenta","https://www.trf4.jus.br/trf4/controlador.php?acao=noticia_visualizar&id_noticia=15502","https://www.brasildefato.com.br/2025/01/07/lula-demite-paulo-pimenta-da-secom-estamos-comecando-um-segundo-tempo-diz-sidonio-palmeira-novo-ministro/","https://jovempan.com.br/politica/ccj-da-camara-convida-paulo-pimenta-para-explicar-inquerito-de-fake-news-sobre-enchentes-no-rs/","https://agenciabrasil.ebc.com.br/geral/noticia/2024-05/paulo-pimenta-sera-ministro-extraordinario-pela-reconstrucao-do-rs","https://www.osul.com.br/deputado-federal-paulo-pimenta-diz-que-caso-do-arroz-em-sao-borja-e-uma-forma-baixa-vil-e-covarde-para-me-atacarem-2/","https://www.gaz.com.br/pec-da-blindagem-saiba-como-votaram-os-deputados-da-regiao/"],"sup":"Vieira da Cunha (PDT) e Tamyres Filgueira (PT)","prop":[{"tema":"Saúde","texto":"Diz que a saúde será a prioridade do mandato, com mais recursos para reduzir a fila de cerca de 800 mil gaúchos que aguardam consultas, cirurgias e procedimentos.","fonte":"https://portalarauto.com.br/20-09-2026/paulo-pimenta-cita-saude-educacao-e-reconstrucao-entre-prioridades-para-o-senado/"},{"tema":"Reconstrução","texto":"Defende investimentos em prevenção de enchentes, recuperação de matas ciliares e encostas, desassoreamento de rios e modernização de pontes.","fonte":"https://portalarauto.com.br/20-09-2026/paulo-pimenta-cita-saude-educacao-e-reconstrucao-entre-prioridades-para-o-senado/"},{"tema":"Dívida do RS","texto":"Defende uma renegociação definitiva da dívida do Estado com a União para recuperar a capacidade de investimento.","fonte":"https://portalarauto.com.br/20-09-2026/paulo-pimenta-cita-saude-educacao-e-reconstrucao-entre-prioridades-para-o-senado/"},{"tema":"Escala 6x1","texto":"É a favor do fim da escala 6x1, que segundo ele traz dignidade e qualidade de vida ao trabalhador.","fonte":"https://www.rsnoticias.top/2026/07/fim-da-escala-6x1-o-que-pensam-os.html"},{"tema":"STF","texto":"É contra o impeachment de ministros do STF e defende transparência nas investigações e regras para evitar conflito de interesses envolvendo familiares de ministros.","fonte":"https://www.radiocaxias.com.br/233738 sta, advogado e empresário","atual":"Sem mandato; ex-governador do RS (2003-2006)","bio":"Formado em Odontologia e Direito pela UFRGS, começou como vereador em Caxias do Sul em 1976. Foi deputado estadual por dois mandatos e deputado federal por três, período em que liderou o governo Fernando Henrique na Câmara. Governou o Rio Grande do Sul de 2003 a 2006. Tentou o Senado em 2010 e foi vice na chapa presidencial de Henrique Meirelles em 2018, sem sucesso.","esp":"centro","espBase":"É quadro histórico do MDB, partido de centro, foi líder do governo FHC e faz campanha com discurso moderado, apoiado na experiência.","espFonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-rigotto-candidato-ao-senado-pelo-rio-grande-do-sul/","pos_":[{"texto":"Elegeu-se governador em 2002 com 3.148.788 votos, 52,67% do total.","fonte":"https://pt.wikipedia.org/wiki/Germano_Rigotto"},{"texto":"Como deputado federal, relatou a Lei Rouanet e o programa de renda mínima, e presidiu a comissão da reforma tributária.","fonte":"https://pt.wikipedia.org/wiki/Germano_Rigotto"},{"texto":"Foi incluído sete vezes na lista do DIAP dos parlamentares mais influentes do Congresso.","fonte":"https://pt.wikipedia.org/wiki/Germano_Rigotto"},{"texto":"Durante seu governo, o estado recebeu reconhecimento da Unesco pela qualidade do ensino.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-rigotto-candidato-ao-senado-pelo-rio-grande-do-sul/"}],"neg":[{"texto":"Seu governo aumentou em cerca de 20% as alíquotas de ICMS sobre energia, telecomunicações e combustíveis, medida apelidada de tarifaço. Tentou a reeleição em 2006 e não chegou ao segundo turno.","fonte":"https://diplomatique.org.br/rio-grande-do-sul-crise-das-financas-publicas/"},{"texto":"Análise publicada no Le Monde Diplomatique Brasil aponta que a gestão acumulou déficits, atrasou salários, pagou o 13º do funcionalismo por meio de empréstimos no Banrisul e recorreu a depósitos judiciais para fechar o caixa. O mesmo texto registra que a crise fiscal do estado vinha de governos anteriores.","fonte":"https://diplomatique.org.br/rio-grande-do-sul-crise-das-financas-publicas/"}],"fontes":["https://www12.senado.leg.br/noticias/candidatos-2026/rio-grande-do-sul","https://www.cnnbrasil.com.br/eleicoes/quem-e-rigotto-candidato-ao-senado-pelo-rio-grande-do-sul/","https://pt.wikipedia.org/wiki/Germano_Rigotto","https://diplomatique.org.br/rio-grande-do-sul-crise-das-financas-publicas/","https://ahoradosul.com.br/conteudos/2026/09/24/rigotto-aposta-na-experiencia-politica-por-uma-vaga-no-senado/","https://en.wikipedia.org/wiki/2006_Rio_Grande_do_Sul_gubernatorial_election"],"sup":"Cairoli (MDB) e Antonio Hohlfeldt (MDB)","prop":[{"tema":"Dívida do RS","texto":"Defende prorrogar por mais três anos a suspensão do pagamento da dívida do Estado com a União para preservar a capacidade de investimento.","fonte":"https://www.radiocaxias.com.br/eleicoes-2026-germano-rigotto-destaca-experiencia-e-defende-acoes-para-recuperar-protagonismo-do-rs/"},{"tema":"Fundo do Sul","texto":"Propõe um fundo constitucional de desenvolvimento para a região Sul, para financiar obras de infraestrutura.","fonte":"https://www.radiocaxias.com.br/eleicoes-2026-germano-rigotto-destaca-experiencia-e-defende-acoes-para-recuperar-protagonismo-do-rs/"},{"tema":"Saúde","texto":"Defende o reajuste da tabela do SUS.","fonte":"https://www.radiocaxias.com.br/eleicoes-2026-germano-rigotto-destaca-experiencia-e-defende-acoes-para-recuperar-protagonismo-do-rs/"},{"tema":"STF","texto":"Declarou-se favorável ao impeachment de ministros do STF e defende mudanças nas regras do tribunal.","fonte":"https://www.gazetadopovo.com.br/eleicoes/2026/gazeta-do-povo-mapeia-candidatos-senado-impeachment-ministros-stf/"},{"tema":"Escala 6x1","texto":"Avalia que não é o momento de acabar com a escala 6x1 e pede estudos sobre o impacto em microempresas e municípios.","fonte":"https://www.rsnoticias.top/2026/07/fim-da-escala-6x1-o-que-pensam-os.html"}]},{"id":"frederico-antunes", icias/2026/04/320422-stj-anula-juri-e-liberta-medico-preso-no-rs-por-morte-de-bebe-em-parto-domiciliar.html"},{"texto":"O Conselho Regional de Medicina do RS (Cremers) cassou seu registro profissional em 2016, por imperícia, imprudência e negligência. A cassação continua em vigor.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-ric-jones-candidato-ao-senado-pelo-rio-grande-do-sul/"}],"fontes":["https://www12.senado.leg.br/noticias/candidatos-2026/rio-grande-do-sul","https://radiosolaris.com.br/quem-sao-os-candidatos-ao-senado-pelo-rio-grande-do-sul/","https://www.cnnbrasil.com.br/eleicoes/quem-e-ric-jones-candidato-ao-senado-pelo-rio-grande-do-sul/","https://www.acessa.com/noticias/2026/04/320422-stj-anula-juri-e-liberta-medico-preso-no-rs-por-morte-de-bebe-em-parto-domiciliar.html"],"sup":"Domingos Alessandretti (PCO) e Abrão Rafael Spritzer (PCO)","prop":[{"tema":"Saúde da mulher","texto":"Quer abrir um debate nacional sobre humanização do parto e combate à violência obstétrica.","fonte":"https://causaoperaria.org.br/2026/ric-jones-leva-saude-da-mulher-e-direitos-operarios-as-eleicoes/"},{"tema":"Trabalho","texto":"Defende mudanças na legislação trabalhista em favor dos trabalhadores.","fonte":"https://causaoperaria.org.br/2026/ric-jones-leva-saude-da-mulher-e-direitos-operarios-as-eleicoes/"},{"tema":"Prisões","texto":"Coloca entre suas prioridades o debate sobre o sistema penitenciário, que classifica como extremamente violento.","fonte":"https://causaoperaria.org.br/2026/ric-jones-leva-saude-da-mulher-e-direitos-operarios-as-eleicoes/"}]},{"id":"milton-cardoso","cargo":"senador","t2":"Eleitor tende a se dividir","nome":"Milton Cardoso","urna":"Milton Cardoso","num":"455","partido":"PSDB","sit":"Deferido","colig":"Federação PSDB Cidadania","foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIy function render() {

function rota() {
  const h = (location.hash || "").slice(1);
  comparando = h === "comparar" && NOME_CARGO[aba] && cmp[aba].length === 2;
  if (comparando) aberto = null;
  else if (CAND[h]) { aberto = h; aba = CAND[h].cargo; }
  else { aberto = null; if (CARGOS.some((c) => c.id === h)) aba = h; }
  render();
}
function ir(h) {
  grupo = "todos"; verTodos = false;
  if (location.hash.slice(1) === h) rota(); else { try { location.hash = h; } catch (e) { rota(); } }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { rota(); window.scrollTo(0, 0); });
