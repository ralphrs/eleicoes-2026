<script>
(async () => {
const pega = async (u, opcional) => { try { const r = await fetch(u + "?v=" + Math.floor(Date.now() / 300000)); if (!r.ok) throw new Error(u + " " + r.status); return await r.json(); } catch (e) { if (opcional) return null; throw e; } };

const nauf = () => (D.cfg.uf === "RS" ? "no " : "em ") + D.cfg.uf;

const pct = (v) => v == null ? "" : String(v).replace(".", ",") + "%";

const fmtRel = (iso) => {
  const d = new Date(iso); if (!iso || isNaN(d)) return "";
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "agora"; if (min < 60) return `há ${min} min`;

const doCand = (id) => noticias.filter((n) => n.cand === id);

function renderStatus() {

  if (T2) { const d = diasAte(T2.data); s.append(el("span", {}, "2º turno para presidente no ", el("b", {}, T2.dataTexto), d > 1 ? ` (faltam ${d} dias)` : d === 1 ? " (é amanhã)" : d === 0 ? " (é hoje)" : "")); }

function renderTools() {

  for (const t of CARGOS) {

      const b = el("button", { class: "chip", type: "button", id: "grupo-" + g.id, "aria-pressed": String(grupo === g.id), style: g.cor ? `--c:${g.cor}` : null },

  if (maj) D.pesq[aba].forEach((p, i) => {

    b.addEventListener("click", () => { pq[aba] = i; render(); });

    const o = $("ordem"); o.textContent = "";
    for (const x of ORDENS) { const b = el("button", { type: "button", id: "ordem-" + x.id, "aria-pressed": String(ordem === x.id) }, x.nome); b.addEventListener("click", () => { ordem = x.id; verTodos = false; render(); }); o.append(b); }
    const cs = $("chapa"); cs.textContent = ""; cs.append(el("option", { value: "" }, "Qualquer alinhamento"));
    const g1 = el("optgroup", { label: "Chapa ao governo" }); Object.keys(GOV).forEach((k) => g1.append(el("option", { value: "g:" + k }, CAND[k].nome)));
    const g2 = el("optgroup", { label: "Partido do presidenciável" }); Object.keys(PRES).forEach((k) => g2.append(el("option", { value: "p:" + k }, CAND[k].nome)));
    cs.append(g1, g2); cs.value = chapa;
    const sel = $("partido"), lista = D[aba === "federal" ? "fed" : "est"];
    const ps = [...new Set(lista.map((x) => x[1]))].sort((a, b) => a.localeCompare(b, "pt-BR"));
    sel.textContent = ""; sel.append(el("option", { value: "" }, "Todos os partidos"));

function cardEl(c, max, rank, v) {
  const n = doCand(c.id).length, sel = cmp[c.cargo].includes(c.id), rr = pq[c.cargo] === -1 ? resDe(c) : null;
  const b = el("button", { class: "cmp-btn", type: "button", id: "cmp-" + c.id, "aria-pressed": String(sel) }, sel ? "Na comparação" : "Comparar");
  b.addEventListener("click", () => { const l = cmp[c.cargo], i = l.indexOf(c.id); if (i >= 0) l.splice(i, 1); else { if (l.length === 2) l.shift(); l.push(c.id); } render(); });

         : R ? null : el("div", { class: "t2" }, c.cargo === "senador" ? "Num 2º turno: " : "2º turno: ", el("b", {}, c.t2)),

function renderComparar(m) {

function renderResultado(m) {
