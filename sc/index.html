o-que-ninguem-quer-carregar"},{"texto":"Fundou uma confecção de fundo de quintal que se tornou uma das maiores indústrias têxteis do Brasil.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-lunelli-candidato-ao-senado-por-santa-catarina/"},{"texto":"Diz ter assumido a prefeitura com déficit de R$ 62 milhões e equilibrado as contas com corte de despesas, incluindo gastos do próprio gabinete.","fonte":"https://jornalrazao.com/politica/antidio-lunelli-senado-mdb-entrevista-ditadura-da-toga"},{"texto":"Elegeu-se deputado estadual em 2022 e disputa agora sua quarta eleição, a primeira para o Senado.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-lunelli-candidato-ao-senado-por-santa-catarina/"}],"neg":[{"texto":"Em 2022, a divulgação de um registro policial de 2009, que segundo a imprensa catarinense envolveria uma menor de idade, o isolou no MDB e inviabilizou sua pré-candidatura a governador. O caso foi arquivado sem condenação. Lunelli afirma que foi vítima de tentativa de extorsão por uma quadrilha que forjou um flagrante.","fonte":"https://www.nsctotal.com.br/colunista/anderson-silva/isolado-antidio-se-torna-um-fardo-que-ninguem-quer-carregar"},{"texto":"Em 2021 foi criticado por um dirigente histórico do MDB por ter associado opositores da ditadura militar a pessoas que ficavam nas grandes cidades fumando maconha. Ele respondeu que era uma lembrança de menino do interior e reafirmou apoio à democracia.","fonte":"https://www.nsctotal.com.br/colunista/denis-luciano/articulador-do-mdb-no-sul-escreve-carta-com-criticas-para-antidio-lunelli"},{"texto":"Enfrentou uma greve de 31 dias dos servidores municipais ao adotar medidas de austeridade no primeiro mandato em Jaraguá do Sul.","fonte":"https://jornalrazao.com/politica/antidio-lunelli-senado-mdb-entrevista-ditadura-da-toga"}],"prop":[{"tema":"STF","texto":"Propõe mandato de até dez anos para ministros do Supremo, mudança na forma de indicação e abertura de processos de impeachment, falando em ditadura da toga.","fonte":"https://ndmais.com.br/politica/antidio-lunelli-participa-da-sabatina-do-grupo-nd/"},{"tema":"Pacto federativo","texto":"Quer renegociar o pacto federativo para aumentar o retorno dos impostos pagos por Santa Catarina, que ele calcula em 13% a 14%.","fonte":"https://ndmais.com.br/politica/antidio-lunelli-participa-da-sabatina-do-grupo-nd/"},{"tema":"Impostos","texto":"É contra a reforma tributária aprovada, por concentrar recursos em Brasília, e defende um imposto único de 10% repartido entre município, estado e União.","fonte":"https://jornalrazao.com/politica/antidio-lunelli-senado-mdb-entrevista-ditadura-da-toga"},{"tema":"Escala 6x1","texto":"Rejeita o fim da escala 6x1 por lei e defende livre negociação entre patrão e empregado, com pagamento por hora.","fonte":"https://ndmais.com.br/politica/antidio-lunelli-participa-da-sabatina-do-grupo-nd/"},{"tema":"Rodovias","texto":"Cobra investimento federal na duplicação da BR-101 e nos acessos da BR-280 aos portos.","fonte":"https://ndmais.com.br/politica/antidio-lunelli-participa-da-sabatina-do-grupo-nd/"}],"fontes":["https://www.cnnbrasil.com.br/eleicoes/quem-e-lunelli-candidato-ao-senado-por-santa-catarina/","https://ndmais.com.br/politica/lunelli-declara-mais-de-r-613-milhoes-em-bens-ao-disputar-senado-quase-o-dobro-do-patrimonio-de-2022/","https://ndmais.com.br/politica/antidio-lunelli-participa-da-sabatina-do-grupo-nd/","https://jornalrazao.com/politica/antidio-lunelli-senado-mdb-entrevista-ditadura-da-toga","https://www.nsctotal.com.br/colunista/anderson-silva/isolado-antidio-se-torna-um-fardo-que-ninguem-quer-carregar","https://ndmais.com.br/politica/antidio-lunelli-fui-vitima-de-tentativa-de-extorsao/","https://www.nsctotal.com.br/colunista/denis-luciano/articulador-do-mdb-no-sul-escreve-carta-com-criticas-para-antidio-lunelli","https://www.gazetadopovo.com.br/eleicoes/2026/gazeta-do-povo-mapeia-candidatos-senado-impeachment-ministros-stf/","https://www12.senado.leg.br/noticias/candidatos-2026/
