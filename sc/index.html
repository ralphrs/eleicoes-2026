<body>
<title>Candidatos SC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Design system Candidatos 2026 (tokens claro/escuro). Mesmo layout de antes: cabeçalho com status; barra fixa com os cargos; grade de cards por colocação na pesquisa; página do candidato com perfil, fatos e notícias. */
:root {
  --papel: #f5f3ee; --papel-elevado: #ffffff; --papel-fundo: #ebe8e1; --linha: #d9d4c9; --linha-forte: #857f73; --tinta: #15181c; --tinta-suave: #545a61; --petroleo: #0e4d5c; --on-petroleo: #ffffff; --petroleo-suave: #dcebed; --ipe: #c4870f; --ipe-texto: #8a5c00; --on-ipe: #15181c; --ipe-suave: #f5e6c2; --voto-sim: #1f5f9e; --voto-nao: #a84a00; --voto-abstencao: #7d838a; --checagem-verdadeiro: #1f5f9e; --checagem-verdadeiro-suave: #dde9f5; --checagem-impreciso: #7a5200; --checagem-impreciso-suave: #f6e9c9; --checagem-falso: #a52a22; --checagem-falso-suave: #f7dedb; --espectro-esquerda: #a63d2a; --espectro-centro: #7a5a12; --espectro-direita: #2a5796; --fato-positivo: var(--voto-sim); --fato-negativo: var(--voto-nao); --foco: #0e4d5c; --sombra-sm: 0 1px 2px rgba(21, 24, 28, 0.06); --sombra-md: 0 6px 18px rgba(21, 24, 28, 0.09);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-pill: 999px;
  --control-h: 36px; --control-h-sm: 32px;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-sans: "Archivo", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* nomes antigos, apontando para os tokens novos (o JS ainda usa alguns) */
  --e-esq: var(--espectro-esquerda); --e-cen: var(--espectro-centro); --e-dir: var(--espectro-direita);
  --ok: var(--fato-positivo); --err: var(--fato-negativo); --warn: var(--checagem-impreciso);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papel: #111417; --papel-elevado: #1a1e22; --papel-fundo: #0b0d0f; --linha: #2c3136; --linha-forte: #7a828a; --tinta: #ecebe6; --tinta-suave: #a7adb3; --petroleo: #5db4c5; --on-petroleo: #0a1417; --petroleo-suave: #15353d; --ipe: #e0a83a; --ipe-texto: #e0a83a; --on-ipe: #15181c; --ipe-suave: #3b2d11; --voto-sim: #79aee0; --voto-nao: #f0974d; --voto-abstencao: #8b9198; --checagem-verdadeiro: #86b8e8; --checagem-verdadeiro-suave: #172a3d; --checagem-impreciso: #e7b552; --checagem-impreciso-suave: #33280f; --checagem-falso: #f39488; --checagem-falso-suave: #3d1c19; --espectro-esquerda: #f0927f; --espectro-centro: #ddb05f; --espectro-direita: #8db3f0; --fato-positivo: var(--voto-sim); --fato-negativo: var(--voto-nao); --foco: #7fd0df; --sombra-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --sombra-md: 0 8px 22px rgba(0, 0, 0, 0.5); color-scheme: dark; }
}
:root[data-theme="dark"] { --papel: #111417; --papel-elevado: #1a1e22; --papel-fundo: #0b0d0f; --linha: #2c3136; --linha-forte: #7a828a; --tinta: #ecebe6; --tinta-suave: #a7adb3; --petroleo: #5db4c5; --on-petroleo: #0a1417; --petroleo-suave: #15353d; --ipe: #e0a83a; --ipe-texto: #e0a83a; --on-ipe: #15181c; --ipe-suave: #3b2d11; --voto-sim: #79aee0; --voto-nao: #f0974d; --voto-abstencao: #8b9198; --checagem-verdadeiro: #86b8e8; --checagem-verdadeiro-suave: #172a3d; --checagem-impreciso: #e7b552; --checagem-impreciso-suave: #33280f; --checagem-falso: #f39488; --checagem-falso-suave: #3d1c19; --espectro-esquerda: #f0927f; --espectro-centro: #ddb05f; --espectro-direita: #8db3f0; --fato-positivo: var(--voto-sim); --fato-negativo: var(--voto-nao); --foco: #7fd0df; --sombra-sm: 0 1px 2px rgba(0, 0, 0, 0.4); --sombra-md: 0 8px 22px rgba(0, 0, 0, 0.5); color-scheme: dark; }
:root { --faixa-uf: linear-gradient(90deg, #d52b1e 0.00% 50.00%, #00843d 50.00% 100.00%); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--papel); color: var(--tinta); font: 400 15px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--petroleo); text-underline-offset: 3px; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: var(--space-4); padding-block: 28px 64px; display: flex; flex-direction: column; gap: var(--space-6); }
header { display: flex; flex-direction: column; gap: var(--space-3); }
.topo { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: var(--space-3); }
.marca .logo { width: 36px; height: 36px; flex: none; }
.c26-m-dot { fill: var(--petroleo); } .c26-m-hi { fill: var(--ipe); } .c26-m-base { fill: var(--tinta); }
.marca .uf { width: 30px; height: 20px; flex: none; border-radius: 2px; overflow: hidden; display: block; }
h1 { font: 600 clamp(28px, 6vw, 36px)/1.05 var(--font-display); letter-spacing: -0.01em; margin: 0; }
h1 em { font-style: normal; color: var(--petroleo); }
.status { font: 400 12px/16px var(--font-mono); color: var(--tinta-suave); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.status b { color: var(--tinta); font-weight: 500; }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ipe); margin-right: 6px; vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: p 2.4s ease-in-out infinite; } @keyframes p { 50% { opacity: .35; } } }

.dd-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); white-space: nowrap; border-radius: var(--radius-md); font: 500 14px/20px var(--font-sans); height: var(--control-h); padding: 0 var(--space-4); border: 1px solid transparent; cursor: pointer; color: var(--tinta); background: transparent; text-decoration: none; }
.dd-btn:focus-visible, a:focus-visible, .seg button:focus-visible, .chip:focus-visible, summary:focus-visible, .dd-input:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.dd-btn--outline { background: var(--papel-elevado); border-color: var(--linha-forte); box-shadow: var(--sombra-sm); }
.dd-btn--outline:hover { background: var(--papel-fundo); }
.dd-btn--link { color: var(--petroleo); padding: 0; height: auto; }
.dd-btn--link:hover { text-decoration: underline; text-underline-offset: 4px; }
.dd-btn svg { width: 16px; height: 16px; flex: none; }
.dd-btn--primary { background: var(--petroleo); color: var(--on-petroleo); }
.dd-btn--primary:hover { box-shadow: var(--sombra-md); }
.dd-btn--primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.dd-badge { display: inline-flex; align-items: center; border-radius: var(--radius-sm); border: 1px solid currentColor; padding: 1px 8px; font: 600 11.5px/16px var(--font-sans); white-space: nowrap; color: var(--tinta-suave); }
.b-esq { color: var(--espectro-esquerda); }
.b-cen { color: var(--espectro-centro); }
.b-dir { color: var(--espectro-direita); }
.b-warn { color: var(--checagem-impreciso); background: var(--checagem-impreciso-suave); border-color: transparent; }
.b-novo { color: var(--petroleo); background: var(--petroleo-suave); border-color: transparent; }

.tools { display: flex; flex-direction: column; gap: var(--space-3); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--papel); padding-block: var(--space-3); z-index: 2; border-bottom: 1px solid var(--linha); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--papel-fundo); border: 1px solid var(--linha); border-radius: var(--radius-md); max-width: 100%; overflow-x: auto; scrollbar-width: none; align-self: flex-start; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; font: 500 13px/1 var(--font-sans); color: var(--tinta-suave); background: transparent; border: 0; border-radius: 6px; height: 30px; padding: 0 var(--space-3); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--tinta); }
.seg button[aria-pressed="true"] { background: var(--papel-elevado); color: var(--tinta); box-shadow: var(--sombra-sm); }
#cargos button[aria-pressed="true"]::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ipe); }
.seg button .k { font: 500 11px var(--font-mono); color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.seg svg { width: 14px; height: 14px; }
.seg--sm button { height: 26px; padding: 0 10px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px/1 var(--font-sans); color: var(--tinta); background: transparent; border: 1px solid var(--linha); border-radius: var(--radius-pill); padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--papel-elevado); }
.chip .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--tinta-suave)); }
.chip .k { font: 400 11px var(--font-mono); color: var(--tinta-suave); }
.chip[aria-pressed="true"] { border-color: var(--tinta); background: var(--tinta); color: var(--papel); }
.chip[aria-pressed="true"] .k { color: var(--papel); opacity: .75; }
.chip[aria-pressed="true"] .dot { outline: 1.5px solid var(--papel); }
.filtros { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.dd-input { height: var(--control-h); flex: 1 1 220px; min-width: 0; border-radius: var(--radius-md); border: 1px solid var(--linha-forte); background: var(--papel-elevado); padding: 4px var(--space-3); font: 400 14px/20px var(--font-sans); color: var(--tinta); box-shadow: var(--sombra-sm); }
select.dd-input { flex: 0 1 200px; }
.dd-input::placeholder { color: var(--tinta-suave); }

h2 { font: 600 22px/1.25 var(--font-display); letter-spacing: -0.005em; margin: 0; text-wrap: balance; }
h2 small { font: 400 12px var(--font-mono); color: var(--tinta-suave); letter-spacing: 0; margin-left: 8px; }
.lede { margin: 0; color: var(--tinta-suave); font-size: 13.5px; line-height: 20px; max-width: 72ch; }
.bloco { display: flex; flex-direction: column; gap: var(--space-4); }

/* Cards de candidato */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-3); }
.cand { position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--space-3); padding: var(--space-3); border-radius: var(--radius-xl); border: 1px solid var(--linha); background: var(--papel-elevado); box-shadow: var(--sombra-sm); color: var(--tinta); text-decoration: none; }
.cand:hover { border-color: var(--linha-forte); box-shadow: var(--sombra-md); }
.foto { width: 72px; height: 96px; border-radius: var(--radius-md); object-fit: cover; background: var(--papel-fundo); display: block; }
.cand .corpo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cand .linha1 { display: flex; align-items: baseline; gap: 8px; }
.cand .rank { font: 500 12px var(--font-mono); color: var(--ipe-texto); }
.cand .nome { font: 600 18px/1.2 var(--font-display); overflow-wrap: anywhere; }
.cand .sub { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.urna { display: inline-flex; gap: 2px; }
.urna i { font: 700 13px/1 var(--font-mono); font-style: normal; padding: 4px 5px; min-width: 1.6em; text-align: center; border: 1px solid var(--linha-forte); border-radius: var(--radius-sm); background: var(--papel-elevado); color: var(--tinta); }
.urna--g { gap: 3px; }
.urna--g i { font-size: 22px; padding: 8px 10px; border-radius: 6px; }
.barra { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: auto; }
.barra .trilha { height: 6px; border-radius: 3px; background: var(--papel-fundo); overflow: hidden; }
.barra .trilha span { display: block; height: 100%; background: var(--petroleo); border-radius: 3px; }
.barra b { font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cand a.nome { color: inherit; text-decoration: none; }
.cand a.nome::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-xl); }
.cmp-btn { position: relative; z-index: 1; align-self: flex-start; font: 500 12px/1 var(--font-sans); color: var(--tinta-suave); background: transparent; border: 1px solid var(--linha); border-radius: var(--radius-pill); padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.cmp-btn:hover { background: var(--papel-fundo); color: var(--tinta); }
.cmp-btn[aria-pressed="true"] { border-color: var(--petroleo); background: var(--petroleo-suave); color: var(--petroleo); }
.cmp-btn:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.cmp-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: 10px var(--space-3); border-radius: var(--radius-lg); border: 1px solid var(--petroleo); background: var(--petroleo-suave); font-size: 13.5px; }
.comp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-4); }
.comp .rot { grid-column: 1 / -1; font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--linha); padding-top: 10px; margin-top: 14px; }
.comp .cel { min-width: 0; font-size: 14px; overflow-wrap: anywhere; padding-top: 4px; }
.comp .cel .foto { width: min(132px, 100%); height: auto; aspect-ratio: 3 / 4; border-radius: var(--radius-lg); }
.comp .cel h3 { font: 600 clamp(18px, 4vw, 26px)/1.15 var(--font-display); margin: 8px 0 6px; }
.comp ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 8px; }
.comp li b { font-weight: 600; }
.props { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 var(--space-6); }
.props li { padding-block: 10px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 3px; }
.props .tema { font: 500 11px/16px var(--font-mono); color: var(--ipe-texto); text-transform: uppercase; letter-spacing: .06em; }
.props p { margin: 0; font-size: 14.5px; }
/* Página do candidato */
.perfil { display: flex; flex-direction: column; gap: var(--space-6); }
.cab { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.cab .foto { width: 132px; height: 176px; border-radius: var(--radius-lg); }
.cab .info { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cab h2 { font-size: clamp(26px, 5vw, 34px); line-height: 1.1; }
.cab .cargo { font: 500 12px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
.dados { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px var(--space-6); margin: 0; }
.dados div { min-width: 0; }
.dados dt { font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; }
.dados dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
@media (max-width: 520px) { .cab { grid-template-columns: 96px minmax(0, 1fr); } .cab .foto { width: 96px; height: 128px; } }
.prosa { margin: 0; max-width: 70ch; font-size: 16px; line-height: 26px; }
.nota { font-size: 13px; color: var(--tinta-suave); margin: 0; max-width: 72ch; }
.duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-6); }
.fatos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fatos li { padding-block: 12px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 4px; }
.fatos li:first-child { border-top: 0; padding-top: 0; }
.fatos p { margin: 0; font-size: 14.5px; line-height: 22px; }
.fonte { font: 400 12px/16px var(--font-mono); color: var(--tinta-suave); text-decoration: none; overflow-wrap: anywhere; }
a.fonte:hover { color: var(--petroleo); text-decoration: underline; }
.sinal { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; background: var(--c); }
.item { padding-block: 14px; border-top: 1px solid var(--linha); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item:first-child { border-top: 0; }
.item a.titulo { font: 600 15.5px/1.35 var(--font-sans); color: var(--tinta); text-decoration: none; overflow-wrap: anywhere; }
.item a.titulo:hover { color: var(--petroleo); text-decoration: underline; text-underline-offset: 3px; }
.meta { font: 400 12px/16px var(--font-mono); color: var(--tinta-suave); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.resumo { margin: 0; max-width: 68ch; font-size: 14.5px; }
.vazio { background: var(--papel-elevado); border: 1px dashed var(--linha-forte); border-radius: var(--radius-xl); padding: var(--space-6); color: var(--tinta-suave); }
.vazio strong { color: var(--tinta); display: block; margin-bottom: 4px; font: 600 18px var(--font-display); }

.t2 { font-size: 12px; line-height: 1.35; color: var(--tinta-suave); }
.t2 b { font-weight: 500; color: var(--tinta); }
.faixa { display: flex; align-items: flex-start; gap: 6px; padding: var(--space-3) var(--space-3) calc(var(--space-3) + 6px); border-radius: var(--radius-xl); border: 1px solid var(--linha); background: var(--papel-elevado); box-shadow: var(--sombra-sm); position: relative; overflow: hidden; }
.faixa::after { content: ""; position: absolute; inset: auto 0 0 0; height: 6px; background: var(--faixa-uf, var(--petroleo)); }
.faixa .grupo { display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 0; }
.faixa .grupo span { font: 500 10.5px/14px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.faixa .fotos { display: flex; gap: 4px; }
.faixa img { height: clamp(40px, 8.5vw, 92px); width: auto; aspect-ratio: 3 / 4; object-fit: cover; border-radius: var(--radius-md); min-width: 0; flex: 0 1 auto; }
.votos { font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--tinta); }
h3.grupo-t { font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; margin: var(--space-4) 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--linha); }
/* Deputados */
.deps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 var(--space-6); }
.deps li { display: grid; grid-template-columns: 26px auto minmax(0, 1fr); gap: 10px; align-items: center; padding-block: 9px; border-top: 1px solid var(--linha); }
.deps .n { font-weight: 500; font-size: 14.5px; overflow-wrap: anywhere; }
.deps .p { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.deps .r { font: 400 11px var(--font-mono); color: var(--ipe-texto); text-align: right; }
/* Fontes */
.tabela { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--radius-lg); background: var(--papel-elevado); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--linha); vertical-align: top; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--papel-fundo) 45%, transparent); }
thead th { border-top: 0; font: 500 11px/16px var(--font-mono); color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
details { border-top: 1px solid var(--linha); padding-block: 10px; }
details:first-of-type { border-top: 0; }
summary { cursor: pointer; font-weight: 500; }
details ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
footer { font-size: 12.5px; color: var(--tinta-suave); border-top: 1px solid var(--linha); padding-top: 14px; }
.preview-aviso { font: 500 12px/16px var(--font-mono); background: var(--ipe); color: var(--on-ipe); text-align: center; padding: 6px var(--space-4); }

-2026-candidatos-presidencia-da-republica/","pos_":[{"texto":"A taxa de desemprego ficou em 5,3% no trimestre encerrado em agosto de 2026, a menor para o período desde o início da série do IBGE, em 2012. A população ocupada chegou a 103,5 milhões, um recorde.","fonte":"https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/taxa-de-desemprego-cai-para-53-menor-para-o-trimestre-ate-agosto"},{"texto":"O Brasil saiu do Mapa da Fome da ONU em julho de 2025, segundo relatório da FAO divulgado durante o terceiro mandato.","fonte":"https://www.gov.br/mds/pt-br/noticias-e-conteudos/desenvolvimento-social/noticias-desenvolvimento-social/brasil-sai-do-mapa-da-fome-da-onu-conquista-historica-reflete-politicas-publicas-eficazes"},{"texto":"Sancionou em 26 de novembro de 2025 a lei que isenta do Imposto de Renda quem ganha até R$ 5 mil por mês, com desconto parcial até R$ 7.350. A estimativa é de cerca de 15 milhões de beneficiados, com compensação por tributação mínima de rendas acima de R$ 600 mil por ano.","fonte":"https://www12.senado.leg.br/radio/1/noticia/2025/11/26/isencao-do-imposto-de-renda-para-quem-ganha-ate-r-5-mil-e-sancionada"},{"texto":"Foi eleito presidente três vezes. Em 2022 venceu o segundo turno com 60,3 milhões de votos (50,90%), derrotando o então presidente Jair Bolsonaro.","fonte":"https://en.wikipedia.org/wiki/Luiz_In%C3%A1cio_Lula_da_Silva"}],"neg":[{"texto":"Foi condenado na Lava Jato nos casos do tríplex do Guarujá (8 anos e 10 meses) e do sítio de Atibaia (17 anos) e ficou preso por 580 dias. As condenações foram anuladas em 8 de março de 2021 pelo ministro Edson Fachin, do STF, que considerou a 13ª Vara de Curitiba incompetente para julgar os casos. Lula sempre negou as acusações e não tem condenação em vigor.","fonte":"https://agenciabrasil.ebc.com.br/justica/noticia/2021-03/fachin-anula-condenacoes-de-lula-na-lava-jato"},{"texto":"O esquema de descontos indevidos em benefícios do INSS cresceu durante o atual governo: os descontos associativos passaram de R$ 1,66 bilhão em 2023 para R$ 3,5 bilhões em 2024, segundo o relatório da CPMI. O relatório, que pedia o indiciamento de 216 pessoas, entre elas um filho do presidente e um ex-ministro, foi rejeitado por 19 votos a 12 em 28 de março de 2026. Lula não é investigado no caso, a defesa do filho chamou o pedido de eleitoral e o governo diz que barrou o esquema e ressarciu aposentados.","fonte":"https://agenciabrasil.ebc.com.br/politica/noticia/2026-03/cpmi-do-inss-termina-sem-relatorio-final"},{"texto":"A dívida bruta chegou a 82,9% do PIB em agosto de 2026, maior nível em cinco anos, segundo o Banco Central. Eram 71,68% em dezembro de 2022. O déficit primário acumulado de janeiro a agosto foi de 0,99% do PIB. O Tesouro projeta pico de 87,9% em 2029 e queda depois disso.","fonte":"https://otempo.com.br/economia/2026/9/30/divida-bruta-do-brasil-atinge-82-9-do-pib-em-agosto-maior-nivel-em-cinco-anos-mostra-bc"},{"texto":"O escândalo do mensalão, esquema de compra de apoio parlamentar, ocorreu no primeiro mandato e levou à condenação de aliados como o ex-ministro José Dirceu. Lula não foi denunciado e disse que não sabia do esquema.","fonte":"https://en.wikipedia.org/wiki/Luiz_In%C3%A1cio_Lula_da_Silva"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/taxa-de-desemprego-cai-para-53-menor-para-o-trimestre-ate-agosto","https://www.gov.br/mds/pt-br/noticias-e-conteudos/desenvolvimento-social/noticias-desenvolvimento-social/brasil-sai-do-mapa-da-fome-da-onu-conquista-historica-reflete-politicas-publicas-eficazes","https://www12.senado.leg.br/radio/1/noticia/2025/11/26/isencao-do-imposto-de-renda-para-quem-ganha-ate-r-5-mil-e-sancionada","https://en.wikipedia.org/wiki/Luiz_In%C3%A1cio_Lula_da_Silva","https://agenciabrasil.ebc.com.br/justica/noticia/2021-03/fachin-anula-condenacoes-de-lula-na-lava-jato","https://agenciabrasil.ebc.com.br/politica/noticia/2026-03/cpmi-do-inss-termina-sem-relatorio-final","https://www.gazetadopovo.com.br/republica/relatorio-da-cpmi-aponta-participacao-de-altos-escaloes-que-encobriam-assalto-a-aposentados/","https://otempo.com.br/economia/2026/9/30/divida-bruta-do-brasil-atinge-82-9-do-pib-em-agosto-maior-nivel-em-cinco-anos-mostra-bc"],"vice":"Geraldo Alckmin (PSB)","partidos":["PT","PCdoB","PV","PSB","PDT","PSOL","Rede"],"prop":[{"tema":"Trabalho","texto":"Acabar com a escala 6x1 e reduzir a jornada semanal para 40 horas, sem corte de salários.","fonte":"https://www.band.com.br/politica/eleicoes/eleicoes-2026-conheca-o-perfil-e-as-principais-propostas-de-lula-pt"},{"tema":"Economia","texto":"Manter a valorização do salário mínimo com reajustes acima da inflação e isentar de impostos a cesta básica.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Segurança","texto":"Criar o Ministério da Segurança Pública para coordenar o combate ao crime organizado e adotar padrões nacionais para câmeras corporais.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Saúde","texto":"Ampliar a rede pública de prevenção, diagnóstico e tratamento do câncer e incluir exames laboratoriais no Farmácia Popular.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Educação","texto":"Chegar a 80% das crianças alfabetizadas na idade certa, ampliar o ensino em tempo integral, as vagas em creches e os institutos federais.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Meio ambiente","texto":"Reduzir o desmatamento, recuperar florestas e manter o Fundo Amazônia.","fonte":"https://portalamazonia.com/amazonia/planos-gov naro-e-eleito-presidente-da-csp"},{"texto":"Foi relator do projeto que acabou com as saídas temporárias de presos, aprovado em 2024.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/"},{"texto":"É coautor de duas propostas que viraram lei: a isenção de IPVA para veículos com mais de 20 anos e a lei de fomento ao microcrédito (PL 3.190/2023). Como deputado estadual, cerca de 24% das suas 208 proposições viraram lei.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/"}],"neg":[{"texto":"Foi denunciado pelo Ministério Público do Rio em novembro de 2020 por organização criminosa, lavagem de dinheiro e peculato no caso das rachadinhas, sobre suposto desvio de salários de assessores na Alerj. O STJ anulou decisões e provas, e o TJ-RJ arquivou a denúncia em maio de 2022. Em 26 de fevereiro de 2025, o ministro Gilmar Mendes negou recursos do MP e manteve o arquivamento. Flávio sempre negou as acusações. Não houve julgamento do mérito.","fonte":"https://www.infomoney.com.br/politica/gilmar-nega-recursos-e-mantem-arquivado-caso-das-rachadinhas-de-flavio-bolsonaro/"},{"texto":"É investigado em inquérito aberto em 22 de julho de 2026 pelo ministro André Mendonça, do STF, sobre o financiamento do filme Dark Horse, cinebiografia do pai. A PF apura suspeitas de lavagem de dinheiro, evasão de divisas e corrupção em repasses do banqueiro Daniel Vorcaro, do Banco Master, que somariam R$ 61 milhões. Flávio admite ter pedido recursos a Vorcaro, mas nega irregularidade. Não há denúncia.","fonte":"https://www.cnnbrasil.com.br/blogs/teo-cury/politica/flavio-bolsonaro-e-investigado-no-stf-sobre-financiamento-de-dark-horse/"},{"texto":"Em sete anos de Senado apresentou 57 projetos de lei, com foco em segurança pública, mas nenhuma proposta própria nessa área virou lei, segundo levantamento da Folhapress.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/"},{"texto":"Foi multado pelo TSE por divulgar informações falsas sobre Lula na campanha de 2022 e sobre o chamado kit gay em 2018.","fonte":"https://pt.wikipedia.org/wiki/Fl%C3%A1vio_Bolsonaro"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://pt.wikipedia.org/wiki/Fl%C3%A1vio_Bolsonaro","https://en.wikipedia.org/wiki/Fl%C3%A1vio_Bolsonaro","https://www25.senado.leg.br/web/senadores/senador/-/perfil/5894","https://www12.senado.leg.br/noticias/materias/2025/02/19/flavio-bolsonaro-e-eleito-presidente-da-csp","https://jornaldebrasilia.com.br/noticias/politica-e-poder/flavio-bolsonaro-mirou-seguranca-mas-nao-teve-projetos-proprios-transformados-em-lei/","https://www.brasildefato.com.br/2026/04/02/em-sete-anos-flavio-bolsonaro-teve-apenas-um-projeto-de-lei-aprovado-no-congresso/","https://www.infomoney.com.br/politica/gilmar-nega-recursos-e-mantem-arquivado-caso-das-rachadinhas-de-flavio-bolsonaro/","https://www.cnnbrasil.com.br/blogs/teo-cury/politica/flavio-bolsonaro-e-investigado-no-stf-sobre-financiamento-de-dark-horse/","https://diariocarioca.com/2026/09/30/politica/eleicoes/investigacao-de-flavio-bolsonaro-no-caso-dark-horse-pode-ser-suspensa-se-ele-for-eleito"],"vice":"Alfredo Gaspar (PL)","partidos":null,"prop":[{"tema":"Segurança","texto":"Reduzir a maioridade penal de 18 para 16 anos, classificar facções como organizações narcoterroristas e construir cinco presídios federais de segurança máxima.","fonte":"https://www.correiobraziliense.com.br/politica/2026/08/7480363-veja-os-principais-pontos-do-programa-de-governo-de-flavio-bolsonaro.html"},{"tema":"Economia","texto":"Cortar pelo menos dez ministérios, reduzir impostos e retomar o Programa Nacional de Desestatização.","fonte":"https://www.correiobraziliense.com.br/politica/2026/08 ante-a-presidencia/"},{"texto":"O Vendedor de Sonhos passou de 2,5 milhões de exemplares e foi adaptado para o cinema.","fonte":"https://www.gazetadopovo.com.br/ideias/como-augusto-cury-ergueu-imperio-comercial-com-teoria-controversa/"},{"texto":"Criou em 2010 a Escola da Inteligência, programa que chegou a cerca de 900 escolas particulares e 330 mil alunos. Em 2020, a Arco Educação comprou 60% do negócio por R$ 288 milhões.","fonte":"https://www.gazetadopovo.com.br/ideias/como-augusto-cury-ergueu-imperio-comercial-com-teoria-controversa/"},{"texto":"Depois do debate de 22 de agosto de 2026, tornou-se o primeiro candidato da chamada terceira via a alcançar dois dígitos nas pesquisas, segundo a CNN Brasil.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-o-escritor-augusto-cury-candidato-do-avante-a-presidencia/"}],"neg":[{"texto":"Cinco psiquiatras ouvidos pela Folha de S.Paulo disseram que a Teoria da Inteligência Multifocal não tem validação científica nem uso na prática clínica. Cury responde que milhares de pessoas aplicam a teoria e que a psicanálise e a terapia cognitivo-comportamental também são questionadas.","fonte":"https://jornaldebrasilia.com.br/noticias/brasil/augusto-cury-mira-empreendedores-nega-inspiracao-em-marcal-e-tem-teoria-questionada/"},{"texto":"Escreveu que a sua teoria poderia resolver casos de autismo, condição que não tem cura, o que foi criticado por especialistas. Ele diz que falava em resolução e tratamento, não em cura.","fonte":"https://jornaldebrasilia.com.br/noticias/brasil/augusto-cury-mira-empreendedores-nega-inspiracao-em-marcal-e-tem-teoria-questionada/"},{"texto":"O plano de governo cita um doutorado de 2013 em Psicologia Multifocal pela Florida Christian University, mas o currículo dele no CNPq registra doutorado em administração pela mesma instituição, que não é credenciada, segundo a Gazeta do Povo.","fonte":"https://www.gazetadopovo.com.br/ideias/como-augusto-cury-ergueu-imperio-comercial-com-teoria-controversa/"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://www.cnnbrasil.com.br/eleicoes/quem-e-o-escritor-augusto-cury-candidato-do-avante-a-presidencia/","https://www.gazetadopovo.com.br/ideias/como-augusto-cury-ergueu-imperio-comercial-com-teoria-controversa/","https://jornaldebrasilia.com.br/noticias/brasil/augusto-cury-mira-empreendedores-nega-inspiracao-em-marcal-e-tem-teoria-questionada/","https://pt.wikipedia.org/wiki/Augusto_Cury","https://en.wikipedia.org/wiki/Augusto_Cury"],"vice":"Júlio Delgado (Avante)","partidos":null,"prop":[{"tema":"Instituições","texto":"Trocar o presidencialismo pelo semipresidencialismo e criar mandatos de oito anos para ministros do STF.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Saúde","texto":"Tornar a saúde mental prioridade nacional e ampliar o atendimento a pessoas neurodivergentes na rede pública.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Economia","texto":"Dobrar a produção brasileira de alimentos em dez anos e criar 10 mil clubes de empreendedorismo em escolas e igrejas.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Educação","texto":"Incluir artes cênicas no currículo escolar e investir na formação de profissionais de inteligência artificial e robótica.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Meio ambiente","texto":"Criar o Programa Amazônia Viva, com investimentos em infraestrutura, educação e tecnologia, e preservar a Zona Franca de Manaus.","fonte":"https://portalamazonia.com/amazonia/planos-governo-presidencia-amazonia-26/"}]},{"id":"ronaldo-caiado","cargo":"presidente","  março de 2026)","bio":"Caiado é médico e fundou em 1985 a União Democrática Ruralista (UDR), que presidiu até 1989, ano em que disputou a Presidência pela primeira vez e teve 0,72% dos votos. Foi deputado federal por cinco mandatos e senador por Goiás. Governou o estado de 2019 até 31 de março de 2026, quando deixou o cargo para concorrer ao Planalto pelo PSD. O vice na chapa é Gilberto Kassab.","esp":"centro-direita","espBase":"Classificação usada pelo InfoMoney no perfil dos candidatos de 2026. A trajetória dele é ligada à bancada ruralista e a partidos como PFL, DEM e União Brasil.","espFonte":"https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","pos_":[{"texto":"Goiás teve queda de 58,4% nos homicídios entre 2014 e 2024, a segunda maior do país, segundo o Atlas da Violência 2026 (Ipea e Fórum Brasileiro de Segurança Pública). De 2019 a 2024, período do governo dele, a taxa caiu 43%.","fonte":"https://www.maisgoias.com.br/politica/goias-registra-queda-de-quase-60-nos-homicidios-em-dez-anos/"},{"texto":"Era o governador mais bem avaliado entre os estados pesquisados pela Quaest em dezembro de 2024, com 88% de aprovação.","fonte":"https://www.infomoney.com.br/politica/quaest-condenado-pela-justica-eleitoral-caiado-e-o-governador-mais-bem-avaliado/"},{"texto":"Foi eleito governador no primeiro turno duas vezes: em 2018, com 59,73% dos votos, e em 2022, com 51,81%.","fonte":"https://pt.wikipedia.org/wiki/Ronaldo_Caiado"},{"texto":"Foi escolhido melhor senador de 2015 no prêmio do Congresso em Foco.","fonte":"https://pt.wikipedia.org/wiki/Ronaldo_Caiado"}],"neg":[{"texto":"Foi condenado em primeira instância pela Justiça Eleitoral em dezembro de 2024 por abuso de poder político, por usar a sede do governo em eventos de apoio a Sandro Mabel na eleição de Goiânia, e declarado inelegível por oito anos. Em 8 de abril de 2025, o TRE-GO derrubou a inelegibilidade por unanimidade, mas manteve multa de R$ 60 mil por conduta vedada. A defesa disse que foram reuniões fechadas, sem impacto eleitoral. Cabia recurso ao TSE.","fonte":"https://agenciabrasil.ebc.com.br/justica/noticia/2025-04/tre-go-afasta-inelegibilidade-de-governador-ronaldo-caiado"},{"texto":"Deixou o governo com pelo menos dez parentes em cargos comissionados, segundo o Poder360. A assessoria dele afirmou que todos têm qualificação técnica e exercem as funções sem irregularidade.","fonte":"https://www.poder360.com.br/poder-eleicoes/caiado-deixa-governo-de-goias-com-ao-menos-10-parentes-em-cargos/"},{"texto":"As mortes por ação policial em Goiás subiram de 429 em 2018 para mais de 500 por ano de 2019 a 2023. Em 2022 foram 538, o equivalente a 30,2% das mortes violentas intencionais no estado, segundo levantamento da Folhapress. O governo destaca a queda geral dos indicadores de criminalidade.","fonte":"https://jornaldebrasilia.com.br/noticias/politica-e-poder/com-alta-de-letalidade-policial-gestao-caiado-acumula-polemicas-na-seguranca-em-goias/"}],"fontes":["https://www.infomoney.com.br/politica/eleicoes-2026-candidatos-presidencia-da-republica/","https://pt.wikipedia.org/wiki/Ronaldo_Caiado","https://en.wikipedia.org/wiki/Ronaldo_Caiado","https://www.maisgoias.com.br/politica/goias-registra-queda-de-quase-60-nos-homicidios-em-dez-anos/","https://www.infomoney.com.br/politica/quaest-condenado-pela-justica-eleitoral-caiado-e-o-governador-mais-bem-avaliado/","https://agenciabrasil.ebc.com.br/justica/noticia/2025-04/tre-go-afasta-inelegibilidade-de-governador-ronaldo-caiado","https://www.poder360.com.br/poder-eleicoes/caiado-deixa-governo-de-goias-com-ao-menos-10-parentes-em-cargos/","https://jornaldebrasilia.com.br/noticias/politica-e-poder/com-alta-de-letalidade-policial-gestao-caiado-acumula-polemicas-na-seguranca-em-goias/","https://ohoje.com/2026/03/31/caiado-conclui-ciclo-em-goias-com-seguranca/"],"vice":"Gilberto Kassab (PSD)","partidos":null,"prop":[{"tema":"Segurança","texto":"Criar o Ministério da Segurança Pública, classificar facções e milícias como grupos terroristas e reduzir a maioridade penal para 16 anos em crimes graves.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Economia","texto":"Fazer as despesas obrigatórias crescerem abaixo do PIB nominal, levar a Selic para perto de 10% e fazer reformas administrativa e previdenciária.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Estatais","texto":"Privatizar partes da Petrobras, mantendo o pré-sal sob controle estatal.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Instituições","texto":"Acabar com a reeleição para cargos do Executivo por emenda constitucional e anistiar Jair Bolsonaro e os envolvidos no 8 de janeiro.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Saúde","texto":"Levar atenção primária fluvial e itinerante, telemedicina e transporte sanitário aéreo e fluvial à Amazônia.","fonte":"https://portalamazonia.com/amazonia/planos-governo-presidencia-amazonia-26/"},{"tema":"Meio ambiente","texto":"Criar um sistema nacional integrado de prevenção e manejo do fogo e uma plataforma de governança fundiária da Amazônia.","fonte":"https://portalamazonia.com/amazonia/planos-governo-presidencia-amazonia-26/"}]},{"id":"renan-santos","cargo":"presidente","t2":"Maioria tende a Flávio, com parte anulando","nome":"Renan Santos","urna":"Renan Santos","num":"14","partido":"Missão","sit":"Deferido","colig":null,"foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADhAKEDAS /kK8mlKo5YnAGScmkxM4Lx1qH2nVINPRspANz/AO8f8B/Oq1gyrGAwyMViz3LXuqT3TnJlkLfrWjDOFX71R1BrQ0ZmjK/JnHPb2FYd42OtaaSB4ySc1iX8u6QqO1NiidN4OLLG8oTcrOQfbpXXM8SIZAqggVznheIW+lD5tp3HcD69615ryxAMct3EAevziqWxLepnmMXN6Xf5mJ4FWNVZbTTj0B6cVYhvdJiYGO5gJ/3+ayNcL34CQFWQehoEcx9oNFWv7IkoqNTXQ3Z+g+grnj95vqf50UVbIR1Gk/cH0qW+++Pwoopolkdl/wAfI/3G/lXU/Dz/AJHJP+ubUUUho9qPWlHWiimaDqYepoooAr6h/wAg26/65N/I14pqf/Hjef8AXF/5GiikxM8hh+9V1On40UVmUy7B/qT9Kxrr/j6/GiimxR3NnU/+PZvq3/oRrmz0oopvZBHdjT1ra0T/AF60UUohLY6aiiirMj//2Q==","tse":"https://divulgacandcontas.tse.jus.br/divulga/#/candidato/BR/BR/20322002026/280002540694/2026/BR","completo":"Renan Antônio Ferreira dos Santos","idade":42,"natural":"São Paulo (SP)","ocup":"Empresário, ativista político e influenciador","atual":"Presidente nacional do partido Missão; nunca exerceu mandato eletivo","bio":"Renan Santos nasceu em São Paulo em 1984 e cursou direito na USP, sem concluir. Foi um dos fundadores do Movimento Brasil Livre (MBL) em 2014, grupo que ganhou projeção nos protestos pelo impeachment de Dilma Rousseff. Preside o Missão, partido criado por integrantes do MBL, e disputa a Presidência com o tenente-coronel da reserva Aroldo Medina como vice.","esp":"direita","espBase":"O candidato e o MBL defendem liberalismo econômico e endurecimento na segurança pública, e são descritos como de direita, em oposição ao bolsonarismo.","espFonte":"https://en.wikipedia.org/wiki/Renan_Santos","pos_":[{"texto":"Cofundou o MBL em 2014, movimento que organizou grandes protestos de apoio à Lava Jato e pelo impeachment de Dilma Rousseff.","fonte":"https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-renan-santos-candidato-do-partido-missao-a-presidencia"},{"texto":"Liderou a criação do Missão, que reuniu mais de 500 mil assinaturas válidas e teve o registro aprovado pelo TSE em novembro de 2025, tornando-se o 30º partido do país.","fonte":"https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/"},{"texto":"Pesquisa AtlasIntel/Bloomberg de julho de 2026 registrou 7,8% das intenções de voto para ele, com 38% entre eleitores de 16 a 24 anos. O Datafolha apontou 3%.","fonte":"https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/"}],"neg":[{"texto":"É investigado pelo Ministério Público de São Paulo, junto com familiares, por suspeita de lavagem de dinheiro com uso de empresas de fachada. A apuração vem de operação de julho de 2020 e foi ampliada em 2022; segundo o Metrópoles, uma denúncia anterior por tráfico de influência foi rejeitada pela Justiça. A defesa afirma que ele refuta qualquer ato ilícito e está à disposição das autoridades.","fonte":"https://www.metropoles.com/brasil/entenda-por-que-promotoria-investiga-lavagem-de-dinheiro-no-mbl"},{"texto":"Em decisão publicada em 9 de setembro de 2026, a Justiça Federal rejeitou o pedido para reconhecer a prescrição e excluí-lo de cobranças de impostos da Martin Artefatos de Metal, que deve R$ 1,17 milhão. Ele diz que saiu da empresa em 2022 por ordem judicial e que não responde por dívidas geradas por outros sócios.","fonte":"https://iclnoticias.com.br/justica-confirma-dividas-de-renan-santos/"},{"texto":"Reportagens do UOL (2016) e do Metrópoles (2022) apontaram dezenas de processos e dívidas tributárias e trabalhistas ligadas a empresas da família. Em 2022 a dívida dele com a União era estimada em R$ 6,3 milhões.","fonte":"https://en.wikipedia.org/wiki/Renan_Santos"},{"texto":"A Agência Pública registrou declarações criticadas por ele, como a de fevereiro de 2024 em que disse que \"não existe essa conversa de democracia\", além de propostas como restringir o voto de beneficiários do Bolsa Família e decretar estado de sítio no primeiro dia de governo.","fonte":"https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/"}],"fontes":["https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-renan-santos-candidato-do-partido-missao-a-presidencia","https://en.wikipedia.org/wiki/Renan_Santos","https://apublica.org/2026/07/partido-missao-o-projeto-de-poder-de-renan-santos-e-do-mbl/","https://www.metropoles.com/brasil/entenda-por-que-promotoria-investiga-lavagem-de-dinheiro-no-mbl","https://iclnoticias.com.br/justica-confirma-dividas-de-renan-santos/"],"vice":"Coronel Medina (Missão)","partidos":null,"prop":[{"tema":"Economia","texto":"Aprovar uma PEC de transição fiscal que desvincula os pisos de saúde e educação da receita e revê benefícios tributários, com economia estimada em R$ 1,1 trilhão até 2031.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Estado","texto":"Reduzir o número de municípios de 5.570 para cerca de 1.656 e privatizar os Correios.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Segurança","texto":"Adotar política de guerra contra as facções com apoio das Forças Armadas, reduzir a maioridade penal e ampliar o acesso da população a armas.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Saúde","texto":"Criar prontuário único no SUS com inteligência artificial, oferecer Ozempic na rede pública e legalizar o uso terapêutico de canabidiol e psilocibina.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Infraestrutura","texto":"Elevar o investimento em infraestrutura a até 4% do PIB, com prioridade para ferrovias.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Defesa","texto":"Desenvolver armamento nuclear brasileiro e formar uma reserva estratégica em Bitcoin.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"}]},{"id":"zema","cargo":"presidente","t2":"Maioria tende a Flávio Bolsonaro","nome":"Romeu Zema","urna":"Zema","num":"30","partido":"Novo","sit":"Deferido","colig":null,"foto":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADhAKEDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD3cnFNJppNNJqCrCk03NFJmgYE0ZpM0ySRUUsxwAMk0gHEionnjjBLOAB15rida8deVI8FnD93I3sen4VyMmv3l4zNLcMByT81K47Hq8msWSdbhPzrP/4Sa1BJZwBnAry+W7dZQzPwehB4NR3F+Y7jG7jjFILHrqa5ZMQPPXkZqY6laAZ+0R+v3q8h/tU+VuBx83PvSHUTI5AY7V5phY9nWRZFyrAg+lBrynTtevbRkKSsUH8JPWvQ9J1aPUrZXGFk6MvoaANA0lKaSgBpppNONRt1oACaTdTTRSAduoptFAG4aSmlqTNWIdmkJpuaKQBmuZ8XawtpZNbIf3kinPP3RXSOwVST2FeNeKdY+06tPIzkbW2qPYUMEYlxIRIcknJqqLlC3HY457f/AFqgmvw7Ad/THWkkQSr8g57npUtlpNl1roSW5Q8FCcfSqlzIXZG5PTNNhtJ2OCOKtppc7jBzx2qHJGkabZXefbblR/E3WmW1wy5Un5T1q/JokrpjdjHQVTk0i5Rsc7RQpoHSkjUtrvzJARjIxgV1Xh/U/sWoRl2/dPwxrhI4pIOuVxWzYTs8RT9apO5Di1uezKwZQwOQRkUtZPhu5a60OB3OWGVz9DWselUQNNRmnmmGgBppKU9aQ0gG5opKKANgtS7qjzRmqEPzSZpuaM0AMupAlrKx4AQnNfPGtXDGSeb+HeTn15r3zWXZdHuyg5ETY/Kvn7XYmMDoPvZ59qQ0UdIRrx3lbnBwK6KG1AxxWdokHlWoAFb8J6ZFc83qdlOKJre3ULnFaMUAGMDg1XgIq5G4yFFZm4/7Op7Uj2QK/dqwrZIq1Hhh2osK5kNp0cqHKDP0rDmhbT9SMJ4jlGUb0NdkVANZHiCxFzY70++nKmrg7MzqxTR0HgS5LWNxbMMNG+R9DXWGuD8JTC3vE3ZHnqOnrXdmug4WNNNJ , depois de vencer em 2018 partindo de cerca de 3% nas pesquisas.","fonte":"https://www.infomoney.com.br/perfil/romeu-zema/"},{"texto":"Fechou em 2021 o acordo de R$ 37,68 bilhões com a Vale para reparar os danos do rompimento da barragem de Brumadinho.","fonte":"https://pt.wikipedia.org/wiki/Romeu_Zema"},{"texto":"Aprovou reforma administrativa em 2019, que reduziu as secretarias de 21 para 12, e reforma da previdência estadual em 2020.","fonte":"https://pt.wikipedia.org/wiki/Romeu_Zema"}],"neg":[{"texto":"A dívida pública de Minas passou de R$ 200 bilhões e continuou crescendo durante seu governo, apesar dos superávits. As forças de segurança acumulam perdas salariais sem recomposição integral.","fonte":"https://www.em.com.br/colunistas/ana-mendonca/2026/01/7324953-zema-prometeu-arrumar-a-casa-o-que-minas-entrega-em-2026.html"},{"texto":"Em 4 de março de 2026, a deputada Dandara (PT-MG) pediu ao Ministério Público de Minas a abertura de inquérito civil sobre cerca de R$ 128 bilhões em renúncias fiscais de 2017 a 2024. É um pedido de investigação, sem acusação formal; Zema não respondeu ao Poder360 até a publicação.","fonte":"https://www.poder360.com.br/poder-congresso/deputada-pede-investigacao-contra-zema-por-renuncias-fiscais/"},{"texto":"O InfoMoney cita como desgastes os incentivos fiscais concedidos à Eletrozema, empresa da família, e a doação de R$ 1 milhão do pai de Daniel Vorcaro, do Banco Master, ao Novo na campanha de 2022.","fonte":"https://www.infomoney.com.br/perfil/romeu-zema/"},{"texto":"Em 1º de maio de 2026 lamentou em um podcast que crianças não possam trabalhar no Brasil e disse que mudaria a regra, o que gerou forte reação. No dia seguinte afirmou defender mais oportunidades para adolescentes, com proteção e sem prejuízo da escola.","fonte":"https://www.em.com.br/politica/2026/05/7410773-zema-defende-mais-oportunidade-de-trabalho-a-menores-de-idade-apos-criticas.html"},{"texto":"Foi multado pelo TSE em maio de 2024 por propaganda eleitoral antecipada na campanha de 2022. Também foi criticado por dizer, em 2020, que a violência doméstica seria um instinto natural do ser humano e, em 2023, por falas sobre Sul e Sudeste em relação a Norte e Nordeste.","fonte":"https://pt.wikipedia.org/wiki/Romeu_Zema"}],"fontes":["https://www.infomoney.com.br/perfil/romeu-zema/","https://en.wikipedia.org/wiki/Romeu_Zema","https://pt.wikipedia.org/wiki/Romeu_Zema","https://www.em.com.br/colunistas/ana-mendonca/2026/01/7324953-zema-prometeu-arrumar-a-casa-o-que-minas-entrega-em-2026.html","https://www.poder360.com.br/poder-congresso/deputada-pede-investigacao-contra-zema-por-renuncias-fiscais/","https://www.em.com.br/politica/2026/05/7410773-zema-defende-mais-oportunidade-de-trabalho-a-menores-de-idade-apos-criticas.html"],"vice":"Eduardo Girão (Novo)","partidos":null,"prop":[{"tema":"Economia","texto":"Privatizar todas as estatais federais, cortar gastos públicos e reduzir impostos.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Trabalho","texto":"Criar um regime alternativo à CLT, com contratos e pagamentos diários, semanais ou quinzenais.","fonte":"https://spdiario.com.br/noticias/politica/tse-reune-planos-de-governo-dos-presidenciaveis-veja-principais-propostas-para-o-brasil.html"},{"tema":"Segurança","texto":"Tratar facções como organizações terroristas, reduzir a maioridade penal e adotar política de encarceramento em massa.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Saúde","texto":"Ampliar parcerias com hospitais e clínicas particulares, as concessões a organizações sociais e a telemedicina.","fonte":"https://spdiario.com.br/noticias/politica/eleicoes-2026-veja-as-principais-propostas-dos-candidatos-a-presidencia.html"},{"tema":"Educação","texto":"Ampliar as escolas cívico-militares e regulamentar o ensino domiciliar.","fonte":"https iu o PCO no inquérito das fake news, mandou a PF ouvir Pimenta e determinou a suspensão dos perfis do partido nas redes, após publicações que pediam a dissolução do STF. Pimenta classificou a medida como arbitrária e contrária à liberdade de expressão. As fontes consultadas não registram denúncia contra ele.","fonte":"https://www.cartacapital.com.br/politica/moraes-inclui-o-pco-no-inquerito-das-fake-news/"},{"texto":"Chamou de totalmente absurdos os julgamentos dos envolvidos no 8 de janeiro, que considera um protesto político e não uma tentativa de golpe, posição que o isola na esquerda.","fonte":"https://www.itatiaia.com.br/politica/eleicoes/conheca-a-carreira-politica-de-rui-costa-pimenta-pre-candidato-a-presidencia/"},{"texto":"Ficou em último lugar nas três eleições presidenciais que disputou: teve 38.619 votos em 2002, 12.206 em 2010 e 12.324 em 2014.","fonte":"https://jovempan.com.br/politica/conheca-rui-costa-pimenta-candidato-do-pco-a-presidencia/"}],"fontes":["https://www.correiobraziliense.com.br/politica/2026/08/7489638-quem-e-rui-costa-pimenta-candidato-ao-planato-pelo-pco.html","https://jovempan.com.br/politica/conheca-rui-costa-pimenta-candidato-do-pco-a-presidencia/","https://www.cartacapital.com.br/politica/moraes-inclui-o-pco-no-inquerito-das-fake-news/","https://conjur.com.br/2006-out-25/stf_mantem_impugnacao_candidatura_rui_pimenta/","https://www.itatiaia.com.br/politica/eleicoes/conheca-a-carreira-politica-de-rui-costa-pimenta-pre-candidato-a-presidencia/","https://www.otempo.com.br/eleicoes/2026/candidatos/presidente/rui-costa-pimenta-29","https://en.wikipedia.org/wiki/Rui_Costa_Pimenta","https://www.gazetadopovo.com.br/ideias/quem-sao-e-o-que-querem-os-nanicos-na-disputa-presidencial-em-2026/"],"vice":"Antônio Carlos Silva (PCO)","partidos":null,"prop":[{"tema":"Salário","texto":"Fixar o salário mínimo em R$ 7.500.","fonte":"https://www.gazetadopovo.com.br/eleicoes/2026/propostas-inusitadas-economia-candidatos-presidencia-eleicoes-2026/"},{"te  de Jair Bolsonaro.","espFonte":"https://www.gazetadopovo.com.br/brasil/jorginho-mello-fiel-bolsonaro-eleicoes-2026/","pos_":[{"texto":"Santa Catarina ficou em 1º lugar no Ranking de Competitividade dos Estados de 2026, à frente de São Paulo pela primeira vez em 15 anos.","fonte":"https://ndmais.com.br/politica/ranking-de-competitividade-jorginho-mello-fala-sobre-posicao-historica-de-sc/"},{"texto":"No Senado, foi o autor do Pronampe, programa de crédito com juros reduzidos para micro e pequenas empresas criado durante a pandemia.","fonte":"https://ndmais.com.br/politica/quem-e-jorginho-mello-historia-carreira-politica-e-relacao-com-familia-bolsonaro/"},{"texto":"Anunciou reajuste de 21,5% para mais de 35 mil servidores da segurança pública.","fonte":"https://www.gazetadopovo.com.br/brasil/jorginho-mello-fiel-bolsonaro-eleicoes-2026/"},{"texto":"Foi eleito governador em 2022 com cerca de 2,98 milhões de votos, 70,69% dos válidos no segundo turno.","fonte":"https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-jorginho-mello-que-disputa-o-governo-de-sc-pelo-pl"}],"neg":[{"texto":"Sancionou em janeiro de 2026 a lei que proibia cotas raciais em universidades estaduais. Em 17 de abril de 2026 o STF declarou a lei inconstitucional por 7 votos a 2. Jorginho criticou a decisão e disse que a lei não acabava com as cotas, mas as direcionava aos alunos mais pobres.","fonte":"https://www.nsctotal.com.br/noticias/derrotado-no-stf-jorginho-mello-critica-derrubada-de-lei-que-pos-fim-as-cotas-raciais-em-sc"},{"texto":"Relatório preliminar do TCE-SC apontou cerca de 18 mil possíveis benefícios irregulares no programa Universidade Gratuita. Em julho de 2025 o governador respondeu que a Polícia Civil investigava 130 casos, perto de 0,5% dos alunos, e defendeu o programa.","fonte":"https://ndmais.com.br/politica/jorginho-mello-se-irrita-e-rebate-dados-do-tce-05-de-sem-vergonhas/"},{"texto":"No debate de 30 de setembro de 2026 foi cobrado por uma postagem sobre a morte do cão Orelh 01% dos votos válidos.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-joao-rodrigues-candidato-ao-governo-de-santa-catarina/"},{"texto":"Pesquisa Neokemp de 30 e 31 de março de 2026 registrou 80,4% de aprovação à sua gestão em Chapecó.","fonte":"https://ndmais.com.br/politica/pesquisa-indica-alta-popularidade-de-joao-rodrigues-como-prefeito-de-chapeco/"},{"texto":"Em 2014 foi o segundo deputado federal mais votado de Santa Catarina, com 221.409 votos.","fonte":"https://ndmais.com.br/politica/quem-e-joao-rodrigues-da-marinha-a-comunicacao-trajetoria-e-polemicas-na-carreira-politica"}],"neg":[{"texto":"Foi condenado pelo TRF4 a cinco anos e três meses por dispensa irregular e fraude em licitação, em caso de 1999, quando era prefeito interino de Pinhalzinho. Cumpriu parte da pena em 2018. Em dezembro de 2020 o STJ reconheceu a prescrição e extinguiu a punibilidade, o que não equivale a absolvição. Em 27 de setembro de 2026 o TRE-SC negou pedido da coligação para tirar do ar propaganda que cita a prisão.","fonte":"https://ndmais.com.br/politica/tre-sc-nega-pedido-de-joao-rodrigues-e-mantem-propaganda-sobre-prisao-em-2018/"},{"texto":"Em março de 2006 o TRF4 confirmou sua condenação por racismo, por declarações contra indígenas em programa de TV em 1999, com pena de dois anos e quatro meses convertida em serviços à comunidade. A notícia do tribunal é da época e não informa o resultado de recursos posteriores.","fonte":"https://www.trf4.jus.br/trf4/controlador.php?acao=noticia_visualizar&id_noticia=4981"},{"texto":"Em outubro de 2022 o Ministério Público do Trabalho abriu procedimento para apurar um vídeo em que pedia a empresários que orientassem seus funcionários na eleição presidencial. A prefeitura disse na ocasião que não havia sido notificada.","fonte":"https://www.infomoney.com.br/mercados/prefeito-de-chapeco-e-investigado-por-pedir-que-empresarios-orientem-trabalhadores-a-votar-em-bolsonaro/"},{"texto":"As medidas adotadas em Chapecó para a população em situação de rua, com defesa de internação involuntária de dependentes químicos, ganharam repercussão nacional e são contestadas na Justiça.","fonte":"https://ndmais.com.br/politica/quem-e-joao-rodrigues-da-marinha-a-comunicacao-trajetoria-e-polemicas-na-carreira-politica"}],"prop":[{"tema":"Finanças","texto":"Garantir no mínimo 15% da receita corrente líquida para investimentos, com corte de estruturas redundantes e auditoria de contratos.","fonte":"https://ndmais.com.br/politica/como-joao-rodrigues-pretende-governar-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Segurança","texto":"Criar a Muralha Digital Catarinense, com reconhecimento facial, leitura de placas e alertas por inteligência artificial, além de barreiras tecnológicas nas divisas.","fonte":"https://ndmais.com.br/politica/como-joao-rodrigues-pretende-governar-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Saúde","texto":"Construir novos hospitais regionais e montar uma força-tarefa médica para zerar a fila de cirurgias.","fonte":"https://ndmais.com.br/politica/como-joao-rodrigues-pretende-governar-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Educação","texto":"Ampliar o ensino em tempo integral com foco em matemática, português e inglês e apoiar os municípios na abertura de creches.","fonte":"https://ndmais.com.br/politica/como-joao-rodrigues-pretende-governar-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Infraestrutura","texto":"Financiar duplicações, terceiras faixas e manutenção de rodovias e levar energia trifásica e internet ao campo.","fonte":"https://ndmais.com.br/politica/como-joao-rodrigues-pretende-governar-santa-catarina-veja-o-plano-de-governo/"}],"fontes":["https://ndmais.com.br/politica/quem-e-joao-rodrigues-da-marinha-a-comunicacao-trajetoria-e-polemicas-na-carreira-politica","https://www.cnnbrasil.com.br/eleicoes/quem-e-joao-rodrigues-candidato-ao-governo-de-santa-catarina/","https://ndmais.com.br/politica/pesquisa-indica-alta-popularidade-de-joao-rodrigues-como-prefeito icipação em uma rede de pequenas centrais hidrelétricas por meio de empresa familiar com capital superior ao patrimônio declarado. Merisio respondeu que sua situação era absolutamente legal e que se tratava de organização patrimonial e investimento de longo prazo. A reportagem não cita processo judicial.","fonte":"https://www.intercept.com.br/2018/09/30/gelson-merisio-hidreletricas-governo-sc/"},{"texto":"É criticado por adversários pela mudança de lado: apoiou Jair Bolsonaro em 2018 e hoje é o candidato da coligação que inclui o PT. Ele diz que quem mudou foi ele, decepcionado com a condução da pandemia.","fonte":"https://www.gazetadopovo.com.br/eleicoes/2026/santa-catarina-2026/esquerda-pre-candidato-gelson-merisio-governo-sc-apoiou-bolsonaro/"}],"prop":[{"tema":"Previdência","texto":"Acabar com a cobrança de 14% sobre aposentados do Estado.","fonte":"https://ndmais.com.br/politica/o-que-merisio-promete-para-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Saúde","texto":"Criar Centros Regionais de Especialidades nas 16 regiões de saúde e ampliar a telessaúde.","fonte":"https://ndmais.com.br/politica/o-que-merisio-promete-para-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Mobilidade","texto":"Implantar tarifa zero no transporte público.","fonte":"https://ndmais.com.br/politica/o-que-merisio-promete-para-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Educação","texto":"Fazer concursos para professores efetivos e ampliar o ensino técnico integrado ao ensino médio.","fonte":"https://ndmais.com.br/politica/o-que-merisio-promete-para-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Segurança","texto":"Aumentar o efetivo policial e adotar câmeras corporais e policiamento comunitário.","fonte":"https://ndmais.com.br/politica/o-que-merisio-promete-para-santa-catarina-veja-o-plano-de-governo/"},{"tema":"Clima","texto":"Criar sistemas de alerta antecipado e reduzir a população em áreas de risco.","fonte":"https://ndmais.com.br/politica/o-que-merisio-promete-par votos, mais que o dobro dos 109.363 que recebeu em 2018.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-carol-de-toni-candidata-do-pl-ao-senado-por-santa-catarina/"},{"texto":"Em 2024 tornou-se a primeira deputada catarinense a presidir a CCJ da Câmara, considerada a comissão mais importante da Casa.","fonte":"https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-carol-de-toni-candidata-do-pl-ao-senado-por-sc"},{"texto":"Recebeu em 2025 o prêmio de melhor deputada federal de Santa Catarina do Congresso em Foco. No mesmo ano foi a parlamentar catarinense com mais relatorias, 71.","fonte":"https://ndmais.com.br/politica/projetos-e-trajetoria-quem-e-carol-de-toni-politica-de-sc/"},{"texto":"Ocupou a liderança da Minoria na Câmara entre fevereiro e novembro de 2025 e coordenou o Fórum Parlamentar Catarinense em 2023.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-carol-de-toni-candidata-do-pl-ao-senado-por-santa-catarina/"}],"neg":[{"texto":"Sua gestão na CCJ em 2024 foi criticada por deputados de esquerda e de centro, que a classificaram como ideológica e autoritária. Ela pautou a PEC que proíbe o aborto sem exceções e extinguiu as reuniões prévias de negociação entre bancadas. Aliados elogiaram a condução por dar visibilidade às pautas da direita.","fonte":"https://www.nsctotal.com.br/colunista/dagmara-spautz/como-carol-de-toni-blindou-oposicao-e-fincou-bandeira-ideologica-na-ccj-da-camara"},{"texto":"Apresentou projetos contestados, como o que impede a obrigatoriedade de vacinas sem eficácia que ela considera comprovada, o que acaba com a cota de 30% de candidaturas femininas e o que inscreve Olavo de Carvalho no Livro dos Heróis da Pátria.","fonte":"https://ndmais.com.br/politica/projetos-e-trajetoria-quem-e-carol-de-toni-politica-de-sc/"},{"texto":"A candidatura ao Senado quase foi retirada pelo PL quando Carlos Bolsonaro se mudou para Santa Catarina. O episódio abriu um racha público no partido no estado, e a vaga foi mantida após pressão interna.","fonte":"https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-carol-de-toni-candidata-do-pl-ao-senado-por-sc"}],"prop":[{"tema":"STF","texto":"Defende mandato fixo e limite de idade para ministros do Supremo, o fim de decisões monocráticas que derrubem leis do Congresso e a abertura de processos de impeachment contra ministros.","fonte":"https://ndmais.com.br/politica/criticas-ao-supremo-menos-impostos-e-conversa-com-jair-bolsonaro-carol-de-toni-abre-o-jogo-em-sabatina-do-grupo-nd/"},{"tema":"Impostos","texto":"Promete trabalhar por redução da carga tributária sobre trabalhadores e empresas e é contra o fim da escala 6x1 por lei, preferindo a negociação entre patrões e empregados.","fonte":"https://ndmais.com.br/politica/criticas-ao-supremo-menos-impostos-e-conversa-com-jair-bolsonaro-carol-de-toni-abre-o-jogo-em-sabatina-do-grupo-nd/"},{"tema":"Rodovias","texto":"Coloca como prioridade a duplicação das BRs 282 e 470, a solução dos gargalos da BR-101 e ferrovias ligadas aos portos catarinenses.","fonte":"https://ndmais.com.br/politica/criticas-ao-supremo-menos-impostos-e-conversa-com-jair-bolsonaro-carol-de-toni-abre-o-jogo-em-sabatina-do-grupo-nd/"},{"tema":"Costumes","texto":"Posiciona-se contra a legalização das drogas e do aborto e a favor do ensino domiciliar e do acesso de civis a armas.","fonte":"https://ndmais.com.br/politica/projetos-e-trajetoria-quem-e-carol-de-toni-politica-de-sc/"}],"fontes":["https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-carol-de-toni-candidata-do-pl-ao-senado-por-sc","https://www.cnnbrasil.com.br/eleicoes/quem-e-carol-de-toni-candidata-do-pl-ao-senado-por-santa-catarina/","https://ndmais.com.br/politica/projetos-e-trajetoria-quem-e-carol-de-toni-politica-de-sc/","https://ndmais.com.br/politica/criticas-ao-supremo-menos-impostos-e-conversa-com-jair-bolsonaro-carol-de-toni-abre-o-jogo-em-sabatina-do-grupo-nd/","https://www.nsctotal.com.br/colunista/dagmara-spautz/como-carol-de-toni-blindou-oposicao-e-fincou-bandeira is-votado-do-rio-de-janeiro/"},{"texto":"Elegeu-se pela primeira vez aos 17 anos, em 2000, e venceu sete eleições consecutivas para a Câmara do Rio, quase sempre com votação crescente.","fonte":"https://www.cnnbrasil.com.br/eleicoes/carlos-bolsonaro-bate-o-proprio-recorde-e-e-o-vereador-mais-votado-do-rio-de-janeiro/"},{"texto":"Mesmo estreante no estado, aparece tecnicamente empatado na liderança das pesquisas para o Senado em Santa Catarina. Na Quaest de 20 a 23 de setembro tinha 16%, contra 17% de Carol de Toni e 15% de Esperidião Amin.","fonte":"https://www.gazetadopovo.com.br/eleicoes/2026/pesquisa-eleitoral-2026/quaest-senador-santa-catarina-setembro-2026/"}],"neg":[{"texto":"Foi indiciado pela Polícia Federal em junho de 2025 no inquérito da chamada Abin paralela. A PF afirma que ele integrava o núcleo político de um grupo que usou a agência para espionagem ilegal. Até junho de 2026 ele não havia sido denunciado, e a PGR pediu o envio do caso à primeira instância. Carlos diz que o indiciamento é perseguição política com vistas à eleição de 2026.","fonte":"https://agenciabrasil.ebc.com.br/justica/noticia/2025-06/pf-diz-que-bolsonaro-e-carlos-integravam-organizacao-criminosa-na-abin"},{"texto":"É investigado pelo Ministério Público do Rio por suspeita de rachadinha em seu antigo gabinete. O MP arquivou o caso em relação a ele em setembro de 2024 por falta de provas, mas um juiz discordou e a apuração foi reaberta em fevereiro de 2026. Ele não foi denunciado. Em junho de 2026, seu ex-chefe de gabinete e outras seis pessoas viraram réus, acusados de desviar cerca de R$ 1,9 milhão. As reportagens consultadas não registram manifestação da defesa de Carlos.","fonte":"https://www.jornalopcao.com.br/ultimas-noticias/mp-do-rio-reabre-investigacao-contra-carlos-bolsonaro-por-suspeita-de-rachadinha-797384/"},{"texto":"É criticado por adversários e por parte do próprio PL por não ter vínculos com Santa Catarina. Em 2025 a Fiesc divulgou nota contra candidatos de fora do estado. Ele responde que não nasceu em SC, mas que foi lá que renasceu.","fonte":"https://www.terra.com.br/noticias/brasil/carlos-bolsonaro-enfrenta-pleito-acirrado-ao-senado-em-santa-catarina,0ace47957ecb02bfc2c4decae58b461cghfsym8t.html"},{"texto":"Não participou de nenhum debate da campanha até 25 de setembro e avisou que não iria ao da NSC TV, o que rendeu cobranças públicas de Esperidião Amin.","fonte":"https://www.nsctotal.com.br/politica/senado-em-sc-carlos-bolsonaro-critica-votacoes-de-amin-que-responde-esta-no-carro-vindo-para-o-debate"}],"prop":[{"tema":"STF","texto":"Defende a abertura de processos de impeachment contra ministros do Supremo e a eleição de um presidente do Senado disposto a pautá-los.","fonte":"https://ndmais.com.br/politica/carlos-bolsonaro-manifestacao-florianopolis/"},{"tema":"8 de janeiro","texto":"Promete atuar pela libertação dos presos pelos atos de 8 de janeiro de 2023, que chama de presos políticos.","fonte":"https://ndmais.com.br/politica/carlos-bolsonaro-manifestacao-florianopolis/"},{"tema":"Pacto federativo","texto":"Diz que quer rediscutir o pacto federativo e levar a Brasília demandas do setor produtivo catarinense em logística, energia, habitação e segurança.","fonte":"https://upiara.com.br/noticias/carlos-bolsonaro-entrevista/"},{"tema":"Governo","texto":"Afirma que dará sustentação no Senado a um eventual governo de Flávio Bolsonaro e que isso garantiria prioridade às demandas de Santa Catarina.","fonte":"https://upiara.com.br/noticias/carlos-bolsonaro-entrevista/"}],"fontes":["https://www12.senado.leg.br/noticias/candidatos-2026/santa-catarina","https://www.poder360.com.br/poder-eleicoes/candidatura-de-carlos-ao-senado-de-sc-e-anunciada-com-racha-na-direita/","https://www.cnnbrasil.com.br/eleicoes/carlos-bolsonaro-bate-o-proprio-recorde-e-e-o-vereador-mais-votado-do-rio-de-janeiro/","https://www.gazetadopovo.com.br/eleicoes/2026/pesquisa-eleitoral-2026/quaest-senador-santa-catarina-setembro-2026/","https://agenciabrasil.e p":"Administrador, advogado e professor universitário","atual":"Senador (desde 2019)","bio":"Formado em Administração pela Esag e em Direito pela UFSC, é o político em atividade com a carreira mais longa de Santa Catarina. Foi prefeito de Florianópolis duas vezes, governador em dois mandatos (1983-1987 e 1999-2003), deputado federal e senador nos anos 1990. Voltou ao Senado em 2019 e tenta a reeleição pelo PP, na coligação que apoia João Rodrigues (PSD) ao governo. É casado com a ex-prefeita Angela Amin.","esp":"centro-direita","espBase":"O rótulo considera o posicionamento do PP e da coligação com PSD, MDB e União Brasil, somado às pautas que ele defende no Senado, como a anistia aos condenados do 8 de janeiro e limites ao STF.","espFonte":"https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-esperidiao-amin-candidato-do-pp-ao-senado-de-sc","pos_":[{"texto":"Foi o relator da PEC 8/2021, que limita decisões individuais de ministros nos tribunais superiores, aprovada pelo Senado em novembro de 2023 por 52 votos a 18.","fonte":"https://www12.senado.leg.br/noticias/materias/2023/11/22/senado-aprova-pec-que-limita-decisoes-individuais-em-tribunais"},{"texto":"Elegeu-se governador em 1982, aos 35 anos, o mais jovem do país na época. Em 2014 teve 229.668 votos para deputado federal, então a maior votação da história do estado para o cargo.","fonte":"https://www.band.com.br/noticias/quem-e-esperidiao-amin-senador-que-fara-a-relatoria-da-dosimetria-202512100909"},{"texto":"Atuou na devolução ao estado de R$ 384 milhões que Santa Catarina havia adiantado para obras em rodovias federais. O acerto foi assinado pelo Ministério da Fazenda em março de 2026.","fonte":"https://ndmais.com.br/politica/santa-catarina-esta-sendo-prejudicada-o-plano-de-esperidiao-amin-para-recuperar-verbas-catarinenses-e-melhorar-rodovias/"},{"texto":"Foi escolhido relator, no Senado, do projeto da dosimetria das penas do 8 de janeiro, no fim de 2025.","fonte":"https://www.band.com.br/noticias/quem-e-esperidiao-amin-senador-que-fara-a-relatoria-da-dosimetria-202512100909"}],"neg":[{"texto":"Carlos Bolsonaro o acusa de ter votado com o PT em 58% das vezes e de ter se posicionado contra pautas da direita, como o acesso a armas. Amin rebateu chamando o adversário de estrupício e o desafiou a comparecer aos debates.","fonte":"https://ndmais.com.br/politica/esperidiao-amin-chama-carlos-bolsonaro-de-estrupicio/"},{"texto":"Perdeu o apoio do PL, que preferiu lançar Carol de Toni e Carlos Bolsonaro, e manteve a candidatura por outra coligação. Em 2022 havia ficado em quinto lugar na eleição para governador, com 9,75% dos votos.","fonte":"https://www.nsctotal.com.br/politica/eleicoes-2026-quem-e-esperidiao-amin-candidato-do-pp-ao-senado-de-sc"},{"texto":"Depois do veto de Lula ao projeto da dosimetria, protocolou em janeiro de 2026 um projeto de anistia aos condenados pelo 8 de janeiro e defendeu a anulação do inquérito. O tema divide o Congresso e é rejeitado pelo governo federal, que vetou a dosimetria.","fonte":"https://www.cnnbrasil.com.br/blogs/jussara-soares/politica/apos-veto-de-lula-relator-da-dosimetria-protocola-pl-da-anistia-no-senado/"}],"prop":[{"tema":"Rodovias","texto":"Quer ampliar o modelo em que o estado banca obras em rodovias federais e abate o valor da dívida com a União, para destravar BR-101, BR-282, BR-470 e BR-280.","fonte":"https://ndmais.com.br/politica/santa-catarina-esta-sendo-prejudicada-o-plano-de-esperidiao-amin-para-recuperar-verbas-catarinenses-e-melhorar-rodovias/"},{"tema":"STF","texto":"Defende reforma do Supremo e a abertura de impeachment de ministros, dizendo que a autocontenção do tribunal não funcionou.","fonte":"https://ndmais.com.br/politica/reforma-no-stf-obras-em-rodovias-federais-e-presidencia-do-senado-as-princiais-preocupacoes-de-esperidiao-amin-para-possivel-novo-mandato/"},{"tema":"Escala 6x1","texto":"Apoia o fim da escala 6x1 com transição gradual para o 5x2, acompanhada de financiamento para automação da indústria. ado de forte voto conservador, depois de fazer 17,42% no primeiro turno.","fonte":"https://www.cnnbrasil.com.br/politica/jorginho-mello-e-eleito-governador-de-sc-no-2o-turno/"},{"texto":"Elegeu-se prefeito de Blumenau em 1996 e foi reeleito em 2000 com 90.805 votos. Depois conquistou três mandatos seguidos de deputado federal, sempre com mais de 100 mil votos.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-decio-lima-candidato-do-pt-ao-senado-por-santa-catarina/"},{"texto":"Na Câmara, presidiu a Comissão de Constituição e Justiça entre 2013 e 2014 e foi líder da Minoria em 2017 e 2018.","fonte":"https://www.cnnbrasil.com.br/eleicoes/quem-e-decio-lima-candidato-do-pt-ao-senado-por-santa-catarina/"},{"texto":"Segundo balanço que ele apresenta de sua gestão no Sebrae, a carteira de crédito para pequenos negócios passou de R$ 1 bilhão para R$ 30 bilhões por ano e o atendimento subiu de 20 milhões para 65 milhões de pessoas.","fonte":"https://ndmais.com.br/politica/decio-lima-quer-atuar-a-favor-dos-empresarios-no-senado-e-defende-o-fim-da-escala-6x1-aumenta-a-produtividade/"}],"neg":[{"texto":"Foi réu no Supremo em ação penal que o acusava de desviar verba da fundação hospitalar de Blumenau para pagar publicidade quando era prefeito. Foi absolvido pela 2ª Turma do STF em abril de 2016. O relator, Teori Zavascki, entendeu que não havia prova de participação dele e que ninguém pode ser condenado só pelo cargo que ocupa.","fonte":"https://conjur.com.br/2016-abr-13/nao-imputar-crime-alguem-cargo-ocupa-teori/"},{"texto":"Perdeu o segundo turno de 2022 para Jorginho Mello (PL) por 70,69% a 29,31% dos votos válidos.","fonte":"https://www.cnnbrasil.com.br/politica/jorginho-mello-e-eleito-governador-de-sc-no-2o-turno/"},{"texto":"No levantamento da Gazeta do Povo sobre impeachment de ministros do STF, publicado em setembro de 2026, sua equipe não respondeu e ele ficou sem posição registrada. Em sabatina do Grupo ND, disse apoiar o afastamento de qualquer ministro com corrupção comprovada.","fonte":"https://www.gazetadopovo.com.br/eleicoes/2026/gazeta-do-povo-mapeia-candidatos-senado-impeachment-ministros-stf/"}],"prop":[{"tema":"Escala 6x1","texto":"Defende o fim da escala 6x1 e afirma que a mudança aumenta a produtividade.","fonte":"https://ndmais.com.br/politica/decio-lima-quer-atuar-a-favor-dos-empresarios-no-senado-e-defende-o-fim-da-escala-6x1-aumenta-a-produtividade/"},{"tema":"Pequenos negócios","texto":"Quer usar o mandato para ampliar o crédito e o apoio a micro e pequenas empresas, que segundo ele são 95% das empresas do país.","fonte":"https://ndmais.com.br/politica/decio-lima-quer-atuar-a-favor-dos-empresarios-no-senado-e-defende-o-fim-da-escala-6x1-aumenta-a-produtividade/"},{"tema":"Judiciário","texto":"Propõe repensar o funcionamento do Judiciário, com mandato para ministros, e apoia o impeachment de qualquer ministro do STF com envolvimento comprovado em corrupção, sem seletividade.","fonte":"https://ndmais.com.br/politica/decio-lima-defende-reforma-no-judiciario-e-impeachment-de-alexandre-de-moraes-doa-a-quem-doer/"},{"tema":"Rodovias","texto":"Afirma que a BR-282 será prioridade de sua atuação no Senado.","fonte":"https://clicrdc.com.br/policia/pre-candidato-ao-senado-decio-lima-diz-que-br-282-sera-prioridade-e-promete-atuar-por-santa-catarina/"}],"fontes":["https://www.cnnbrasil.com.br/eleicoes/quem-e-decio-lima-candidato-do-pt-ao-senado-por-santa-catarina/","https://ndmais.com.br/politica/decio-lima-quer-atuar-a-favor-dos-empresarios-no-senado-e-defende-o-fim-da-escala-6x1-aumenta-a-produtividade/","https://ndmais.com.br/politica/decio-lima-defende-reforma-no-judiciario-e-impeachment-de-alexandre-de-moraes-doa-a-quem-doer/","https://conjur.com.br/2016-abr-13/nao-imputar-crime-alguem-cargo-ocupa-teori/","https://noticias.stf.jus.br/postsnoticias/deputado-decio-lima-respondera-a-acao-penal-por-malversacao-de-recursos-publicos-quando-prefeito/","https://www.cnnbrasil.com.br/politica/jorginho-mello-e-eleito-governado
